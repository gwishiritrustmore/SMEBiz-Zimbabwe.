let REP = { which:"day", period:"month", from:monthOf(today())+"-01", to:today() };

const PERIODS = [["today","Today"],["week","This week"],["month","This month"],["lastmonth","Last month"],
                 ["quarter","This quarter"],["year","This year"],["lastyear","Last year"],["custom","Pick dates"]];
function periodRange(key){
  const t = today(), d = new Date(t+"T00:00:00");
  const y = d.getFullYear(), m = d.getMonth();
  const iso = (yy,mm,dd) => new Date(Date.UTC(yy,mm,dd)).toISOString().slice(0,10);
  const monthEnd = (yy,mm) => iso(yy, mm+1, 0);
  if (key === "today")  return { from:t, to:t, label:niceDate(t),
                                 prevFrom:addDays(t,-1), prevTo:addDays(t,-1), prevLabel:"yesterday" };
  if (key === "week"){
    const back = (d.getDay()+6)%7;                 // week starts Monday
    const from = addDays(t,-back);
    return { from, to:t, label:"week beginning "+niceDate(from),
             prevFrom:addDays(from,-7), prevTo:addDays(from,-1), prevLabel:"the week before" };
  }
  if (key === "month"){
    const from = iso(y,m,1);
    return { from, to:t, label:d.toLocaleDateString("en-GB",{month:"long",year:"numeric"}),
             prevFrom:iso(y,m-1,1), prevTo:monthEnd(y,m-1), prevLabel:"last month" };
  }
  if (key === "lastmonth"){
    const from = iso(y,m-1,1);
    return { from, to:monthEnd(y,m-1),
             label:new Date(from+"T00:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"}),
             prevFrom:iso(y,m-2,1), prevTo:monthEnd(y,m-2), prevLabel:"the month before" };
  }
  if (key === "quarter"){
    const q = Math.floor(m/3);
    return { from:iso(y,q*3,1), to:t, label:"Quarter "+(q+1)+" of "+y,
             prevFrom:iso(y,(q-1)*3,1), prevTo:monthEnd(y,(q-1)*3+2), prevLabel:"last quarter" };
  }
  if (key === "year")     return { from:iso(y,0,1), to:t, label:"Year to date "+y,
                                   prevFrom:iso(y-1,0,1), prevTo:iso(y-1,m,d.getDate()), prevLabel:"same time last year" };
  if (key === "lastyear") return { from:iso(y-1,0,1), to:iso(y-1,11,31), label:"Year "+(y-1),
                                   prevFrom:iso(y-2,0,1), prevTo:iso(y-2,11,31), prevLabel:"the year before" };
  return { from:REP.from, to:REP.to, label:niceDate(REP.from)+" to "+niceDate(REP.to),
           prevFrom:null, prevTo:null, prevLabel:"" };
}
function setPeriod(key){
  REP.period = key;
  if (key !== "custom"){ const r = periodRange(key); REP.from = r.from; REP.to = r.to; }
  RENDER.reports();
}

const row = (a,b,cls) => `<tr class="${cls||""}"><td>${esc(a)}</td><td class="r">${money(b)}</td></tr>`;

function drawReport(){
  const f = REP.from, t = REP.to, span = niceDate(f)+" to "+niceDate(t);
  const B = $("#repBody");
  if (REP.which === "day"){
    const d = t, fig = Biz.todayFigures(d);
    const sales = DB.sales.filter(s=>s.date===d);
    const byPay = {cash:0,mobile:0,bank:0,credit:0};
    for (const s of sales){ for (const p of s.payments) byPay[p.method]=r2(byPay[p.method]+p.amount); byPay.credit=r2(byPay.credit+s.credit); }
    B.innerHTML = sheet("Day summary", `
      <table class="tbl"><tbody>
        ${row("Sales for the day", fig.sales)}
        ${row("Cost of the items you sold", -fig.cogs)}
        ${row("Gross profit", r2(fig.sales-fig.cogs), "sect")}
        ${row("Expenses paid", -fig.expenses)}
        ${row("Profit for the day", fig.profit, "grand")}
      </tbody></table>
      <h4>How customers paid</h4>
      <table class="tbl"><tbody>${["cash","mobile","bank","credit"].map(k=>row(PAY_NAME[k], byPay[k])).join("")}
        <tr class="grand"><td>Number of sales</td><td class="r">${sales.length}</td></tr></tbody></table>`, niceDate(d));
  }
  else if (REP.which === "sales"){
    const sales = DB.sales.filter(s=>s.date>=f && s.date<=t);
    const rets = DB.returns.filter(x=>x.date>=f && x.date<=t);
    const gross = r2(sales.reduce((s,x)=>s+x.gross,0));
    const disc  = r2(sales.reduce((s,x)=>s+x.discount,0));
    const ret   = r2(rets.reduce((s,x)=>s+x.net,0));
    const cogs  = Ledger.movement("5000", f, t);
    const byItem = {};
    for (const s of sales) for (const i of s.items){
      byItem[i.name] = byItem[i.name] || {q:0,v:0,c:0};
      byItem[i.name].q += i.qty; byItem[i.name].v = r2(byItem[i.name].v+i.net); byItem[i.name].c = r2(byItem[i.name].c+i.cost);
    }
    const top = Object.entries(byItem).sort((a,b)=>b[1].v-a[1].v).slice(0,15);
    B.innerHTML = sheet("Sales", `
      <table class="tbl"><tbody>
        ${row("Sales before discount", gross)}
        ${row("Discounts given", -disc)}
        ${row("Goods brought back", -ret)}
        ${row("Net sales", r2(gross-disc-ret), "sect")}
        ${row("Cost of the items sold", -cogs)}
        ${row("Gross profit", r2(gross-disc-ret-cogs), "grand")}
      </tbody></table>
      ${dailyChart(f,t)}
      <h4>Best sellers</h4>
      <div class="scroll"><table class="tbl"><thead><tr><th>Item</th><th class="r">Sold</th><th class="r">Money in</th><th class="r">Profit</th></tr></thead>
      <tbody>${top.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="r">${qty(v.q)}</td><td class="r">${money(v.v)}</td><td class="r">${money(r2(v.v-v.c))}</td></tr>`).join("")}</tbody></table></div>`, span);
  }
  else if (REP.which === "profit"){
    const P = periodRange(REP.period);
    const cmp = REP.period !== "custom" && P.prevFrom;
    const inc = Ledger.typeTotal("income", f, t);
    const cost = Ledger.typeTotal("cost", f, t);
    const exps = ACCT.filter(a=>a[2]==="expense")
      .map(a=>[a[1], Ledger.movement(a[0],f,t), cmp?Ledger.movement(a[0],P.prevFrom,P.prevTo):0])
      .filter(x=>x[1]!==0 || x[2]!==0);
    const expTot = r2(exps.reduce((s,x)=>s+x[1],0));
    const incP = cmp ? Ledger.typeTotal("income", P.prevFrom, P.prevTo) : 0;
    const costP = cmp ? Ledger.typeTotal("cost", P.prevFrom, P.prevTo) : 0;
    const expP = cmp ? Ledger.typeTotal("expense", P.prevFrom, P.prevTo) : 0;
    const c3 = (label, now, before, cls) => cmp
      ? `<tr class="${cls||""}"><td>${esc(label)}</td><td class="r">${money(now)}</td>
         <td class="r" style="color:var(--muted)">${money(before)}</td>
         <td class="r">${before ? `<span class="pill ${(now-before>=0)===(String(cls||"").indexOf("cost")<0)?"ok":"bad"}">${
           (now-before>=0?"+":"")+Math.round((now-before)/Math.abs(before)*100)}%</span>` : ""}</td></tr>`
      : row(label, now, cls);
    B.innerHTML = sheet("Did I make a profit?", `
      <table class="tbl">
        ${cmp?`<thead><tr><th></th><th class="r">${esc(P.label)}</th><th class="r">${esc(P.prevLabel)}</th><th class="r">Change</th></tr></thead>`:""}
        <tbody>
        ${c3("Money earned from sales and services", inc, incP)}
        ${c3("Cost of the items you sold", -cost, -costP, "cost")}
        ${c3("Gross profit", r2(inc-cost), r2(incP-costP), "sect")}
        <tr class="sect"><td colspan="${cmp?4:2}">What you spent running the business</td></tr>
        ${exps.map(x=>c3(x[0], -x[1], -x[2], "cost")).join("")}
        ${c3("Total running costs", -expTot, -expP, "cost")}
        ${c3(r2(inc-cost-expTot)>=0?"Profit for the period":"Loss for the period",
             r2(inc-cost-expTot), r2(incP-costP-expP), "grand")}
      </tbody></table>
      <div class="plain" style="margin-top:14px">You kept ${inc? Math.round((inc-cost)/inc*100):0} cents of every dollar of sales before running costs, and ${
        inc? Math.round((inc-cost-expTot)/inc*100):0} cents after them.${
        cmp && incP ? " In "+esc(P.prevLabel)+" it was "+Math.round((incP-costP)/incP*100)+" cents and "+Math.round((incP-costP-expP)/incP*100)+" cents." : ""}</div>`,
      cmp ? P.label+" against "+P.prevLabel : span);
  }
  else if (REP.which === "profit_items"){
    const byP = {}, byC = {};
    for (const s of DB.sales) if (s.date>=f && s.date<=t) for (const i of s.items){
      const pr = Biz.product(i.productId);
      const cat = pr ? pr.category : "Other";
      byP[i.productId] = byP[i.productId] || { n:i.name, cat, q:0, v:0, c:0 };
      byP[i.productId].q += i.qty; byP[i.productId].v = r2(byP[i.productId].v+i.net); byP[i.productId].c = r2(byP[i.productId].c+i.cost);
      byC[cat] = byC[cat] || { v:0, c:0 };
      byC[cat].v = r2(byC[cat].v+i.net); byC[cat].c = r2(byC[cat].c+i.cost);
    }
    const items = Object.values(byP).map(x=>({...x, p:r2(x.v-x.c)})).sort((a,b)=>b.p-a.p);
    const totP = r2(items.reduce((s,x)=>s+x.p,0));
    const cats = Object.entries(byC).map(([n,x])=>({ n, v:x.v, p:r2(x.v-x.c) })).sort((a,b)=>b.p-a.p);
    const idle = DB.products.filter(pr=>pr.type==="good" && !byP[pr.id] && Biz.stockOf(pr.id)>0)
      .map(pr=>({ n:pr.name, q:Biz.stockOf(pr.id), v:r2(Biz.stockOf(pr.id)*Biz.avgCost(pr.id)) }))
      .sort((a,b)=>b.v-a.v);
    B.innerHTML = sheet("What each item earns you", `
      ${items.length ? `<div class="scroll"><table class="tbl">
        <thead><tr><th>Item</th><th class="r">Sold</th><th class="r">Money in</th><th class="r">Cost</th>
          <th class="r">Profit</th><th class="r">Kept per dollar</th><th class="r">Share of profit</th></tr></thead>
        <tbody>${items.map(x=>`<tr><td>${esc(x.n)}<div class="ref">${esc(x.cat)}</div></td>
          <td class="r">${qty(x.q)}</td><td class="r">${money(x.v)}</td><td class="r">${money(x.c)}</td>
          <td class="r"><b>${money(x.p)}</b></td>
          <td class="r">${x.v?Math.round(x.p/x.v*100):0}c</td>
          <td class="r">${totP>0?Math.round(x.p/totP*100):0}%</td></tr>`).join("")}
        <tr class="grand"><td>Total</td><td class="r"></td>
          <td class="r">${money(r2(items.reduce((s,x)=>s+x.v,0)))}</td>
          <td class="r">${money(r2(items.reduce((s,x)=>s+x.c,0)))}</td>
          <td class="r">${money(totP)}</td><td colspan="2"></td></tr></tbody></table></div>
        <h4>By group</h4>
        <table class="tbl"><thead><tr><th>Group</th><th class="r">Money in</th><th class="r">Profit</th><th class="r">Share</th></tr></thead>
        <tbody>${cats.map(c=>`<tr><td>${esc(c.n)}</td><td class="r">${money(c.v)}</td><td class="r">${money(c.p)}</td>
          <td class="r">${totP>0?Math.round(c.p/totP*100):0}%</td></tr>`).join("")}</tbody></table>`
        : `<div class="empty">Nothing was sold in this period.</div>`}
      ${idle.length ? `<h4>Sitting on the shelf, nothing sold in this period</h4>
        <table class="tbl"><tbody>${idle.slice(0,12).map(x=>
          `<tr><td>${esc(x.n)}</td><td class="r">${qty(x.q)}</td><td class="r">${money(x.v)}</td></tr>`).join("")}
        <tr class="grand"><td>Money standing still</td><td class="r"></td>
          <td class="r">${money(r2(idle.reduce((s,x)=>s+x.v,0)))}</td></tr></tbody></table>` : ""}`, span);
  }
  else if (REP.which === "money"){
    const accs = payMethods().map(m=>[PAY_ACC[m], PAY_NAME[m]]);
    B.innerHTML = sheet("Money in and out", `
      <table class="tbl"><thead><tr><th>Where the money sits</th><th class="r">Started with</th><th class="r">Came in</th><th class="r">Went out</th><th class="r">Now</th></tr></thead>
      <tbody>${accs.map(a=>{
        const open = Ledger.read(a[0], addDays(f,-1));
        let din=0, dout=0;
        for (const je of DB.journal){ if (je.date<f||je.date>t) continue;
          for (const l of je.lines) if (l.acc===a[0]){ din+=l.dr; dout+=l.cr; } }
        return `<tr><td>${esc(a[1])}</td><td class="r">${money(open)}</td><td class="r">${money(din)}</td>
          <td class="r">${money(dout)}</td><td class="r"><b>${money(Ledger.read(a[0], t))}</b></td></tr>`;
      }).join("")}
      <tr class="grand"><td>All money together</td><td class="r">${money(r2(accs.reduce((s,a)=>s+Ledger.read(a[0],addDays(f,-1)),0)))}</td>
        <td colspan="2"></td><td class="r">${money(r2(accs.reduce((s,a)=>s+Ledger.read(a[0],t),0)))}</td></tr></tbody></table>
      <h4>Where it came from and went</h4>
      <table class="tbl"><tbody>
        ${row("Cash and transfers taken from customers", r2(Ledger.typeTotal("income",f,t) - r2(DB.sales.filter(s=>s.date>=f&&s.date<=t).reduce((s,x)=>s+x.credit,0))))}
        ${row("Payments received on old accounts", r2(DB.custTx.filter(x=>x.date>=f&&x.date<=t&&x.amount<0).reduce((s,x)=>s-x.amount,0)))}
        ${row("Paid to suppliers", -r2(DB.suppTx.filter(x=>x.date>=f&&x.date<=t&&x.amount<0).reduce((s,x)=>s-x.amount,0)))}
        ${row("Stock bought and paid for straight away", -r2(DB.purchases.filter(p=>p.date>=f&&p.date<=t&&p.method!=="credit").reduce((s,p)=>s+p.total,0)))}
        ${row("Running costs paid", -Ledger.typeTotal("expense",f,t))}
      </tbody></table>`, span);
  }
  else if (REP.which === "stockv"){
    const rows = DB.products.filter(p=>p.type==="good").map(p=>({p, q:Biz.stockOf(p.id), c:Biz.avgCost(p.id)}))
      .sort((a,b)=> b.q*b.c - a.q*a.c);
    B.innerHTML = sheet("What my stock is worth", `
      <div class="scroll"><table class="tbl"><thead><tr><th>Item</th><th class="r">On hand</th><th class="r">Cost each</th><th class="r">Worth</th><th class="r">If all sold</th></tr></thead>
      <tbody>${rows.map(x=>`<tr><td>${esc(x.p.name)}</td><td class="r">${qty(x.q)} ${esc(x.p.unit)}</td>
        <td class="r">${money(x.c)}</td><td class="r">${money(r2(x.q*x.c))}</td><td class="r">${money(r2(x.q*x.p.sell))}</td></tr>`).join("")}
      <tr class="grand"><td>Total</td><td colspan="2"></td><td class="r">${money(Biz.stockValue())}</td>
        <td class="r">${money(r2(rows.reduce((s,x)=>s+x.q*x.p.sell,0)))}</td></tr></tbody></table></div>
      <div class="plain" style="margin-top:14px">Valued at weighted average cost — what you actually paid, averaged across deliveries.</div>`, "as at "+niceDate(t));
  }
  else if (REP.which === "people"){
    B.innerHTML = sheet("Who owes what, and how long it has been owed", `
      <h4>Customers who owe you</h4>
      ${ageTable(DB.customers.map(c=>({ name:c.name, age:Biz.ageing("c", c.id) })), "Nobody owes you anything.")}
      <div class="plain" style="margin-top:12px">Payments are set against the oldest charge first, which is how a
      debt actually ages. Anything sitting in the last two columns needs a phone call today.</div>
      <h4>Suppliers you owe</h4>
      ${ageTable(DB.suppliers.map(s=>({ name:s.name, age:Biz.ageing("s", s.id) })), "You owe nobody.")}`,
      "as at "+niceDate(t));
  }
  else if (REP.which === "insights"){
    const F = advisorFindings();
    B.innerHTML = sheet("What the numbers are telling you", `
      <div class="plain">Everything below is worked out from sales, purchases and expenses you have already entered.
      Nothing here is a guess.</div>
      ${F.length ? F.map(f=>`<div class="finding ${esc(f.tone)}">
        <b>${esc(f.title)}</b><p>${esc(f.text)}</p></div>`).join("")
        : `<div class="empty">Record a few weeks of trading and this page will start telling you things worth knowing.</div>`}`,
      "last 30 days to "+niceDate(today()));
  }
  else if (REP.which === "tax"){
    if (!DB.settings.vatOn){
      B.innerHTML = sheet("VAT summary", `<div class="note">This business is not set up for VAT, so nothing is being
        charged or claimed. If you register with ZIMRA, switch VAT on under Settings and enter your rate — every sale
        and purchase from that day forward will split the tax out on its own.</div>`, span);
    } else {
      const out = Ledger.movement("2200", f, t);
      const inn = Ledger.movement("1250", f, t);
      B.innerHTML = sheet("VAT summary", `
        <table class="tbl"><tbody>
          ${row("VAT charged on what you sold", out)}
          ${row("VAT you paid on what you bought", -inn)}
          ${row(r2(out-inn)>=0?"VAT to pay ZIMRA":"VAT ZIMRA owes you", r2(out-inn), "grand")}
        </tbody></table>
        <div class="plain" style="margin-top:14px">Rate in use: ${esc(String(DB.settings.vatRate||0))}% of the
        VAT-exclusive value. Your prices are treated as already including VAT, so a ${money(115)} sale is
        ${money(100)} of income and ${money(15)} of tax at 15%.
        ${DB.settings.vatNumber?"VAT number "+esc(DB.settings.vatNumber)+".":""}</div>
        <h4>Balances now</h4>
        <table class="tbl"><tbody>
          ${row("VAT you owe ZIMRA to date", Ledger.read("2200"))}
          ${row("VAT you can still claim back", Ledger.read("1250"))}
        </tbody></table>`, span);
    }
  }
  else if (REP.which === "worth"){
    const A = [["1000","Cash"]].concat(fxOn()?[["1005",fxCode()+" cash"]]:[])
      .concat([["1010","Mobile money"],["1020","Bank"],["1200","Money customers owe you"],
               ["1250","VAT you can claim back"],["1300","Stock on hand"],["1500","Equipment"]]);
    const L = [["2000","Money you owe suppliers"],["2200","VAT you owe ZIMRA"],["2100","Loans"]];
    const at = Ledger.read.bind(Ledger);
    const assets = r2(A.reduce((s,a)=>s+at(a[0],t),0));
    const liabs = r2(L.reduce((s,a)=>s+at(a[0],t),0));
    const profit = r2(Ledger.typeTotal("income",null,t) - Ledger.typeTotal("cost",null,t) - Ledger.typeTotal("expense",null,t));
    const cap = at("3000",t), drw = at("3100",t);
    B.innerHTML = sheet("What the business owns and owes", `
      <h4>What it owns</h4>
      <table class="tbl"><tbody>${A.map(a=>row(a[1], at(a[0],t))).join("")}
        <tr class="grand"><td>Total</td><td class="r">${money(assets)}</td></tr></tbody></table>
      <h4>What it owes</h4>
      <table class="tbl"><tbody>${L.map(a=>row(a[1], at(a[0],t))).join("")}
        <tr class="grand"><td>Total</td><td class="r">${money(liabs)}</td></tr></tbody></table>
      <h4>The owner's share</h4>
      <table class="tbl"><tbody>
        ${row("Money you put in", cap)}
        ${row("Money you took out", -drw)}
        ${row("Profit kept in the business", profit)}
        <tr class="grand"><td>Owner's share</td><td class="r">${money(r2(cap-drw+profit))}</td></tr></tbody></table>
      <div class="${Math.abs(r2(assets-liabs-(cap-drw+profit)))<0.02?"plain":"note"}" style="margin-top:14px">
        What it owns (${money(assets)}) less what it owes (${money(liabs)}) equals the owner's share (${money(r2(cap-drw+profit))}).
        ${Math.abs(r2(assets-liabs-(cap-drw+profit)))<0.02?"The books balance.":"Out by "+money(r2(assets-liabs-(cap-drw+profit)))+" — check recent entries."}</div>`, "as at "+niceDate(t));
  }
  else if (REP.which === "trial"){
    let dr=0, cr=0;
    const rows = ACCT.map(a=>{ const b = Ledger.balance(a[0], t); if (Math.abs(b)<0.005) return "";
      if (b>0) dr = r2(dr+b); else cr = r2(cr-b);
      return `<tr><td>${esc(a[0])} ${esc(a[1])}</td><td class="r">${b>0?money(b):""}</td><td class="r">${b<0?money(-b):""}</td></tr>`;
    }).join("");
    B.innerHTML = sheet("Check the books balance", `
      <div class="plain">This is the accountant's view. Everything below was built automatically from the sales, purchases and expenses you entered.</div>
      <table class="tbl" style="margin-top:12px"><thead><tr><th>Account</th><th class="r">Debit</th><th class="r">Credit</th></tr></thead>
      <tbody>${rows}<tr class="grand"><td>Totals</td><td class="r">${money(dr)}</td><td class="r">${money(cr)}</td></tr></tbody></table>
      <div class="${Math.abs(dr-cr)<0.02?"plain":"note"}" style="margin-top:14px">${Math.abs(dr-cr)<0.02
        ? "Debits equal credits. Every transaction in the system is complete." : "Out of balance by "+money(r2(dr-cr))+"."}</div>`, "as at "+niceDate(t));
  }
}

/* Where notes physically change hands the owner types the note count, and the
   dollar value is derived from it — never the other way round, or the till drifts. */
function fxField(inputId, method, hintId){
  return method === "zig"
    ? `<div class="money-in"><span>${esc(fxCode().slice(0,1))}</span>
        <input id="${inputId}" class="num" inputmode="decimal" placeholder="0"></div>
       <div class="hint" id="${hintId}">Type the ${esc(fxCode())} you are handing over or receiving.</div>`
    : `<div class="money-in"><span>$</span><input id="${inputId}" class="num" inputmode="decimal" placeholder="0.00"></div>`;
}
function readFxAmount(inputId, method){
  const raw = Number(($(inputId) || {}).value) || 0;
  if (method !== "zig") return { amount:r2(raw), fx:null };
  return { amount:toBase(raw), fx:{ code:fxCode(), rate:fxRateOn(), amount:r2(raw) } };
}
function fxHint(inputId, hintId, method){
  const el = $(hintId); if (!el || method !== "zig") return;
  const raw = Number(($(inputId)||{}).value) || 0;
  el.textContent = raw > 0
    ? qty(raw)+" "+fxCode()+" is "+money(toBase(raw))+" at "+qty(fxRateOn())+" to the dollar"
    : "Type the "+fxCode()+" you are handing over or receiving.";
}

function ageTable(rows, emptyMsg){
  const live = rows.filter(r=>r.age.total > 0.004).sort((a,b)=>b.age.total-a.age.total);
  if (!live.length) return `<table class="tbl"><tbody><tr><td>${esc(emptyMsg)}</td></tr></tbody></table>`;
  const sum = k => r2(live.reduce((s,r)=>s+r.age[k],0));
  return `<div class="scroll"><table class="tbl">
    <thead><tr><th>Name</th><th class="r">Under a month</th><th class="r">1–2 months</th>
      <th class="r">2–3 months</th><th class="r">Over 3 months</th><th class="r">Total</th></tr></thead>
    <tbody>${live.map(r=>`<tr><td>${esc(r.name)}${r.age.d90>0.004?` <span class="pill bad">very old</span>`:
        r.age.d30+r.age.d60>0.004?` <span class="pill warn">overdue</span>`:""}</td>
      <td class="r">${r.age.current?money(r.age.current):""}</td>
      <td class="r">${r.age.d30?money(r.age.d30):""}</td>
      <td class="r">${r.age.d60?money(r.age.d60):""}</td>
      <td class="r">${r.age.d90?money(r.age.d90):""}</td>
      <td class="r"><b>${money(r.age.total)}</b></td></tr>`).join("")}
    <tr class="grand"><td>Total</td><td class="r">${money(sum("current"))}</td><td class="r">${money(sum("d30"))}</td>
      <td class="r">${money(sum("d60"))}</td><td class="r">${money(sum("d90"))}</td>
      <td class="r">${money(sum("total"))}</td></tr></tbody></table></div>`;
}

function dailyChart(f,t){
  const days = [];
  for (let d=f; d<=t; d=addDays(d,1)) days.push(d);
  const use = days.slice(-21);
  if (use.length < 2) return "";
  const vals = use.map(d => r2(DB.sales.filter(s=>s.date===d).reduce((s,x)=>s+x.net,0)));
  const max = Math.max(...vals, 1), W = 640, H = 130, bw = W/use.length;
  return `<h4>Sales day by day</h4>
    <svg viewBox="0 0 ${W} ${H+22}" style="width:100%;height:auto" role="img" aria-label="Daily sales">
      ${vals.map((v,i)=>{ const h = Math.max(2, v/max*H);
        return `<rect x="${i*bw+2}" y="${H-h}" width="${bw-4}" height="${h}" fill="#0A2342" rx="2"/>`; }).join("")}
      <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#C9A227" stroke-width="2"/>
      <text x="0" y="${H+16}" font-size="11" fill="#5C6B84">${niceDate(use[0])}</text>
      <text x="${W}" y="${H+16}" font-size="11" fill="#5C6B84" text-anchor="end">${niceDate(use[use.length-1])}</text>
      <text x="${W/2}" y="${H+16}" font-size="11" fill="#5C6B84" text-anchor="middle">best day ${money(max)}</text>
    </svg>`;
}

/* ------------------------------------------------------------- THE ADVISOR */
/* Every finding below is derived from entries already in the books. It never
   estimates, guesses or invents a number the owner did not record. */
function advisorFindings(){
  const to = today(), from = addDays(to,-29);
  const pTo = addDays(from,-1), pFrom = addDays(pTo,-29);
  const F = [];
  const inc = Ledger.typeTotal("income", from, to), incP = Ledger.typeTotal("income", pFrom, pTo);
  const cog = Ledger.movement("5000", from, to),    cogP = Ledger.movement("5000", pFrom, pTo);
  const exp = Ledger.typeTotal("expense", from, to), expP = Ledger.typeTotal("expense", pFrom, pTo);
  const gp = r2(inc-cog), gpP = r2(incP-cogP);
  const marg = inc ? gp/inc*100 : 0, margP = incP ? gpP/incP*100 : 0;

  if (incP > 0 && inc > 0){
    const ch = (inc-incP)/incP*100;
    if (Math.abs(ch) >= 5) F.push({ tone: ch>0?"good":"watch", title:(ch>0?"Sales are up ":"Sales are down ")+Math.abs(ch).toFixed(0)+"%",
      text:"You took "+money(inc)+" in the last 30 days against "+money(incP)+" in the 30 days before that." });
  }
  if (inc && incP && Math.abs(marg-margP) >= 2){
    const worse = marg < margP;
    F.push({ tone: worse?"bad":"good",
      title:"You are keeping "+marg.toFixed(0)+" cents in every dollar"+(worse?", down from "+margP.toFixed(0):", up from "+margP.toFixed(0)),
      text: worse ? "Sales can rise while profit falls. The usual cause is suppliers charging you more without your selling price moving. Check your top sellers below."
                  : "Your buying and selling prices are working better together than they were last month." });
  }
  // where the sales actually come from
  const byP = {};
  for (const s of DB.sales) if (s.date>=from && s.date<=to) for (const i of s.items){
    byP[i.productId] = byP[i.productId] || { n:i.name, v:0, c:0, q:0 };
    byP[i.productId].v = r2(byP[i.productId].v + i.net);
    byP[i.productId].c = r2(byP[i.productId].c + i.cost);
    byP[i.productId].q += i.qty;
  }
  const ranked = Object.values(byP).sort((a,b)=>b.v-a.v);
  const tot = r2(ranked.reduce((s,x)=>s+x.v,0));
  if (ranked.length >= 3 && tot > 0){
    const top3 = r2(ranked.slice(0,3).reduce((s,x)=>s+x.v,0));
    F.push({ tone: top3/tot > 0.6 ? "watch" : "good",
      title: ranked.slice(0,3).map(x=>x.n).join(", ")+" bring in "+Math.round(top3/tot*100)+"% of your sales",
      text: top3/tot > 0.6
        ? "Most of the shop rests on three lines. Never let those run out, and be careful about anything that puts their supply at risk."
        : "Your sales are spread across a healthy number of lines." });
  }
  const bestProfit = ranked.map(x=>({...x, p:r2(x.v-x.c)})).sort((a,b)=>b.p-a.p)[0];
  if (bestProfit && bestProfit.p > 0)
    F.push({ tone:"good", title:bestProfit.n+" earns you the most profit",
      text:money(bestProfit.p)+" of profit on "+money(bestProfit.v)+" of sales in 30 days. Give it the best shelf space." });

  // money sitting on the shelf doing nothing
  const dead = DB.products.filter(p=>p.type==="good" && !byP[p.id] && Biz.stockOf(p.id) > 0)
    .map(p=>({ n:p.name, v:r2(Biz.stockOf(p.id)*Biz.avgCost(p.id)) })).sort((a,b)=>b.v-a.v);
  if (dead.length){
    const dv = r2(dead.reduce((s,x)=>s+x.v,0));
    F.push({ tone: dv > 50 ? "watch" : "good", title:money(dv)+" is tied up in stock that has not sold in 30 days",
      text:dead.slice(0,4).map(x=>x.n+" ("+money(x.v)+")").join(", ")+". Consider a special price to turn it back into cash." });
  }
  // how long the shelves would last
  if (cog > 0){
    const days = Math.round(Biz.stockValue() / (cog/30));
    F.push({ tone: days>75?"watch":days<10?"watch":"good", title:"Your stock would last about "+days+" days at this rate of selling",
      text: days>75 ? "That is a lot of money standing still. Buy smaller and more often where the supplier allows it."
          : days<10 ? "You are running very thin. One missed delivery and you will have empty shelves."
                    : "That is a comfortable level for a shop of this size." });
  }
  // overdue money
  let overdue = 0, worst = null;
  for (const c of DB.customers){
    const a = Biz.ageing("c", c.id);
    const old = r2(a.d30 + a.d60 + a.d90);
    if (old > 0.01){ overdue = r2(overdue + old); if (!worst || old > worst.v) worst = { n:c.name, v:old }; }
  }
  if (overdue > 0)
    F.push({ tone: overdue > inc*0.1 ? "bad" : "watch", title:money(overdue)+" has been owed to you for more than 30 days",
      text: (worst ? worst.n+" is the largest at "+money(worst.v)+". " : "") +
            "Old debts turn into bad debts. Ring the oldest accounts before you give any more goods on credit." });

  // costs creeping up
  const up = ACCT.filter(a=>a[2]==="expense").map(a=>{
    const n = Ledger.movement(a[0],from,to), o = Ledger.movement(a[0],pFrom,pTo);
    return { n:a[1], now:n, prev:o, ch: o>0 ? (n-o)/o*100 : 0 };
  }).filter(x=>x.prev > 5 && x.ch > 25).sort((a,b)=>b.ch-a.ch);
  if (up.length)
    F.push({ tone:"watch", title:up[0].n+" is up "+up[0].ch.toFixed(0)+"% on last month",
      text:money(up[0].now)+" against "+money(up[0].prev)+"."+(up.length>1?" "+(up.length-1)+" other cost"+(up.length>2?"s have":" has")+" also risen sharply.":"") });

  // can the business cover itself
  const money30 = moneyHeld();
  if (exp > 0){
    const cover = Math.round(money30 / (exp/30));
    F.push({ tone: cover < 14 ? "bad" : cover < 30 ? "watch" : "good",
      title:"The money you hold covers about "+cover+" days of running costs",
      text: cover < 14 ? "That is thin. Slow down on credit sales and collect what you are owed."
                       : "Rent, wages and the rest are covered without needing new sales to come in first." });
  }
  const order = { bad:0, watch:1, good:2 };
  return F.sort((a,b)=>order[a.tone]-order[b.tone]);
}

  saveAnd(()=>{ DB.budgets[BM] = { ...DB.budgets[prevMonth(BM)] };
    audit("create","Budgets",BM,"Plan copied from "+prevMonth(BM),"","",""); }, "Last month's plan copied");

function budgetStory(b, from, to){
  const planSales = r2(b["4000"]||0);
  const actSales = r2(Ledger.movement("4000",from,to)+Ledger.movement("4100",from,to));
  const parts = [];
  if (planSales) parts.push(actSales >= planSales
    ? "Sales are "+money(r2(actSales-planSales))+" ahead of plan."
    : "Sales are "+money(r2(planSales-actSales))+" behind plan so far.");
  const over = ACCT.filter(a=>a[2]==="expense").map(a=>({n:a[1], d:r2(Ledger.movement(a[0],from,to)-(b[a[0]]||0)), p:b[a[0]]||0}))
    .filter(x=>x.p && x.d>0.5).sort((a,b2)=>b2.d-a.d);
  if (over.length) parts.push(over[0].n+" is "+money(over[0].d)+" over what you planned"+(over.length>1?", and "+(over.length-1)+" other cost"+(over.length>2?"s are":" is")+" over too":"")+".");
  else parts.push("Every cost you planned for is still within budget.");
  return parts.join(" ");
}

function topSeller(){
  const t = {};
  for (const s of DB.sales) for (const i of s.items) t[i.productId] = (t[i.productId]||0) + i.net;
  const best = Object.entries(t).sort((a,b)=>b[1]-a[1])[0];
  return best ? best[0] : (DB.products[0]||{}).id;
}

  const from = addDays(today(),-30);

  for (const s of DB.sales) if (s.date >= from) for (const i of s.items) if (i.productId===pid) q += i.qty;

    $("#lbPrice").oninput = e => { LAB.newPrice = Number(e.target.value)||0; runLab(); };
    $("#lbVol").oninput = e => { LAB.volumeChange = Number(e.target.value);
      $("#lbVolLbl").textContent = "How much would sales change? ("+LAB.volumeChange+"%)"; runLab(); };
  }
  else if (LAB.kind === "expense"){
    $("#labIn").innerHTML = `
      <div class="f"><label>Which cost?</label><select id="lbAcc">
        ${ACCT.filter(a=>a[2]==="expense").map(a=>`<option value="${a[0]}">${esc(a[1])}</option>`).join("")}</select></div>
      <div class="f"><label>New amount each month</label><div class="money-in"><span>$</span>

  }
  else if (LAB.kind === "staff"){

      <div class="f"><label>What would you pay them a month?</label>

      <div class="f"><label>Extra sales you think they would bring in a month</label>
        <div class="money-in"><span>$</span><input id="lbExtra" class="num" inputmode="decimal" value="${LAB.extraSales.toFixed(2)}"></div></div>
      <div class="plain">Leave the extra sales at zero to see the plain cost of the wage, and how much more you
      would have to sell just to stand still.</div>`;

    $("#lbExtra").oninput = e => { LAB.extraSales = Number(e.target.value)||0; runLab(); };
  }
  else if (LAB.kind === "credit"){

        <input type="range" id="lbCd" min="7" max="90" step="7" value="${LAB.creditDays}" style="width:100%"></div>
      <div class="plain">Credit sales are still sales, but the money is not in your hand. This shows how much of
      your cash would be sitting in other people's pockets.</div>`;
    $("#lbCp").oninput = e => { LAB.creditPct = Number(e.target.value);
      $("#lbCpLbl").textContent = "Share of sales taken on credit ("+LAB.creditPct+"%)"; runLab(); };
    $("#lbCd").oninput = e => { LAB.creditDays = Number(e.target.value);
      $("#lbCdLbl").textContent = "How long customers take to pay ("+LAB.creditDays+" days)"; runLab(); };
  }
  else {
    $("#labIn").innerHTML = `<div class="plain">This works out how much you need to sell each month just to cover
      your rent, wages and other running costs — using your own figures from the last 30 days.</div>`;

}
function runLab(){
  const from = addDays(today(),-30);
  const out = $("#labOut");
  if (LAB.kind === "price"){
    const p = Biz.product(LAB.productId);
    const vol = monthlyVolume(LAB.productId) || 1;
    const cost = p.type==="good" ? Biz.avgCost(p.id) : (p.costEst||0);
    const newVol = Math.max(0, Math.round(vol * (1 + LAB.volumeChange/100)));
    const nowRev = r2(vol*p.sell), nowGP = r2(vol*(p.sell-cost));
    const newRev = r2(newVol*LAB.newPrice), newGP = r2(newVol*(LAB.newPrice-cost));
    const impact = r2(newGP - nowGP);
    out.innerHTML = `<div class="lab-out">
      <span class="stamp">Simulation — not your real figures</span>
      <div class="kv"><span>Selling price</span><b>${money(p.sell)} &rarr; ${money(LAB.newPrice)}</b></div>
      <div class="kv"><span>Units a month</span><b>${vol} &rarr; ${newVol}</b></div>
      <div class="kv"><span>Money coming in</span><b>${money(nowRev)} &rarr; ${money(newRev)}</b></div>
      <div class="kv"><span>Profit on this item</span><b>${money(nowGP)} &rarr; ${money(newGP)}</b></div>
      <div class="ln total" style="border-top-color:#C9A227"><span class="lbl" style="color:#fff">Difference each month</span>
        <span class="dots" style="border-color:rgba(255,255,255,.3)"></span>
        <span class="amt num" style="color:${impact>=0?"#8FE0B0":"#FF9E97"}">${impact>=0?"+":""}${money(impact)}</span></div>
      <p style="margin:12px 0 0;font-size:13.5px;color:#C8D6E8">${esc(
        impact >= 0
          ? "Even if you lose "+Math.abs(LAB.volumeChange)+"% of the sales, you would be better off by "+money(impact)+" a month. The risk is customers going elsewhere."
          : "This loses you "+money(-impact)+" a month. The higher price does not make up for the sales you would lose."
      )}</p>
      <button class="btn gold sm" style="margin-top:12px" onclick="saveScenario('${jss(p.name)} at ${money(LAB.newPrice)}',${impact})">Save this idea</button>
    </div>`;
  }
  else if (LAB.kind === "expense"){
    const acc = $("#lbAcc") ? $("#lbAcc").value : "6010";
    const nowAmt = r2(Ledger.movement(acc, from, today()));
    const diff = r2(LAB.expenseChange - nowAmt);
    const gp = r2(Ledger.typeTotal("income",from,today()) - Ledger.typeTotal("cost",from,today()));
    const exp = Ledger.typeTotal("expense",from,today());
    const profitNow = r2(gp - exp), profitNew = r2(profitNow - diff);
    const margin = gp && Ledger.typeTotal("income",from,today()) ? gp/Ledger.typeTotal("income",from,today()) : 0.25;
    out.innerHTML = `<div class="lab-out">
      <span class="stamp">Simulation — not your real figures</span>
      <div class="kv"><span>${esc(ACC_NAME[acc])} now</span><b>${money(nowAmt)}</b></div>
      <div class="kv"><span>New amount</span><b>${money(LAB.expenseChange)}</b></div>
      <div class="kv"><span>Profit last 30 days</span><b>${money(profitNow)}</b></div>
      <div class="ln total" style="border-top-color:#C9A227"><span class="lbl" style="color:#fff">Profit after the change</span>
        <span class="dots" style="border-color:rgba(255,255,255,.3)"></span>
        <span class="amt num" style="color:${profitNew>=profitNow?"#8FE0B0":"#FF9E97"}">${money(profitNew)}</span></div>
      <p style="margin:12px 0 0;font-size:13.5px;color:#C8D6E8">${esc(diff>0
        ? "To stay where you are you would need to sell about "+money(r2(diff/(margin||0.25)))+" more each month."
        : "That saves you "+money(-diff)+" a month.")}</p>
      <button class="btn gold sm" style="margin-top:12px" onclick="saveScenario('${jss(ACC_NAME[acc])} at ${money(LAB.expenseChange)}',${r2(-diff)})">Save this idea</button>
    </div>`;
  }
  else if (LAB.kind === "staff"){
    const inc = Ledger.typeTotal("income", from, today());
    const cost = Ledger.typeTotal("cost", from, today());
    const exp = Ledger.typeTotal("expense", from, today());
    const ratio = inc ? (inc-cost)/inc : 0.25;
    const profitNow = r2(inc - cost - exp);
    const gained = r2(LAB.extraSales * ratio);
    const profitNew = r2(profitNow + gained - LAB.wage);
    const needed = ratio > 0 ? r2(LAB.wage / ratio) : 0;
    out.innerHTML = `<div class="lab-out">
      <span class="stamp">Simulation — not your real figures</span>
      <div class="kv"><span>Profit last 30 days</span><b>${money(profitNow)}</b></div>
      <div class="kv"><span>Their wage</span><b>-${money(LAB.wage)}</b></div>
      <div class="kv"><span>Profit on the extra sales</span><b>+${money(gained)}</b></div>
      <div class="ln total" style="border-top-color:#C9A227"><span class="lbl" style="color:#fff">Profit if you hire</span>
        <span class="dots" style="border-color:rgba(255,255,255,.3)"></span>
        <span class="amt num" style="color:${profitNew>=profitNow?"#8FE0B0":"#FF9E97"}">${money(profitNew)}</span></div>
      <p style="margin:12px 0 0;font-size:13.5px;color:#C8D6E8">${esc(
        "They would need to bring in about "+money(needed)+" of extra sales a month, roughly "+money(r2(needed/30))+
        " a day, just to pay for themselves. " + (profitNew >= profitNow
          ? "On the figures you have entered they would pay for themselves and more."
          : "On these figures you would be "+money(r2(profitNow-profitNew))+" a month worse off."))}</p>
      <button class="btn gold sm" style="margin-top:12px" onclick="saveScenario('Hire someone at ${money(LAB.wage)}',${r2(profitNew-profitNow)})">Save this idea</button>
    </div>`;
  }
  else if (LAB.kind === "credit"){
    const inc = Ledger.typeTotal("income", from, today());
    const daily = r2(inc/30);
    const tied = r2(daily * (LAB.creditPct/100) * LAB.creditDays);
    const nowOwed = Biz.totalOwedToYou();
    const cash = moneyHeld();
    const exp = Ledger.typeTotal("expense", from, today());
    const coverNow = exp ? Math.round(cash/(exp/30)) : 0;
    const coverNew = exp ? Math.round(r2(cash - r2(tied - nowOwed))/(exp/30)) : 0;
    out.innerHTML = `<div class="lab-out">
      <span class="stamp">Simulation — not your real figures</span>
      <div class="kv"><span>Sales a day, last 30 days</span><b>${money(daily)}</b></div>
      <div class="kv"><span>Owed to you right now</span><b>${money(nowOwed)}</b></div>
      <div class="kv"><span>Would be owed to you</span><b>${money(tied)}</b></div>
      <div class="ln total" style="border-top-color:#C9A227"><span class="lbl" style="color:#fff">Cash tied up in other people's hands</span>
        <span class="dots" style="border-color:rgba(255,255,255,.3)"></span>
        <span class="amt num" style="color:${tied>nowOwed?"#FF9E97":"#8FE0B0"}">${money(r2(tied-nowOwed))} more</span></div>
      <p style="margin:12px 0 0;font-size:13.5px;color:#C8D6E8">${esc(
        "Your money would cover about "+coverNew+" days of running costs instead of "+coverNow+". " +
        (tied > cash ? "That is more than all the money you hold — you would not be able to restock."
                     : "Sales look the same on paper either way; only the cash in your hand changes."))}</p>
      <button class="btn gold sm" style="margin-top:12px" onclick="saveScenario('${LAB.creditPct}% on credit, paid in ${LAB.creditDays} days',${r2(nowOwed-tied)})">Save this idea</button>
    </div>`;
  }
  else {
    const inc = Ledger.typeTotal("income", from, today());
    const cost = Ledger.typeTotal("cost", from, today());
    const exp = Ledger.typeTotal("expense", from, today());
    const ratio = inc ? (inc-cost)/inc : 0.25;
    const need = ratio > 0 ? r2(exp/ratio) : 0;
    const daily = r2(need/30);
    out.innerHTML = `<div class="lab-out">
      <span class="stamp">Based on your last 30 days</span>
      <div class="kv"><span>Running costs a month</span><b>${money(exp)}</b></div>
      <div class="kv"><span>You keep, on every dollar sold</span><b>${(ratio*100).toFixed(0)} cents</b></div>
      <div class="kv"><span>You actually sold</span><b>${money(inc)}</b></div>
      <div class="ln total" style="border-top-color:#C9A227"><span class="lbl" style="color:#fff">You must sell at least</span>
        <span class="dots" style="border-color:rgba(255,255,255,.3)"></span>
        <span class="amt num" style="color:#F0D479">${money(need)}</span></div>
      <p style="margin:12px 0 0;font-size:13.5px;color:#C8D6E8">${esc("That is about "+money(daily)+" a day just to break even. "+(
        inc >= need ? "You are above that — everything over it is profit." : "You are "+money(r2(need-inc))+" short of it at the moment."))}</p>
    </div>`;
  }
}
function saveScenario(title, impact){
  saveAnd(()=>DB.scenarios.push({ id:uid(), date:today(), title, impact:r2(impact), user:DB.session.user }), "Idea saved");
  RENDER.lab();
}

      <div class="f"><label>Type it again</label><input id="auPin2" class="num" inputmode="numeric" maxlength="4" type="password"></div>
    </div>
    <div class="plain">Give them the PIN in person and ask them to change it from their own login.</div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn gold" id="auSave">Add them</button>`);
  $("#auRole").onchange = e => { $("#auHint").textContent = ROLE_BLURB[e.target.value] || ""; };
  $("#auSave").onclick = async () => {
    const name = $("#auName").value.trim(), pin = $("#auPin").value.trim(), pin2 = $("#auPin2").value.trim();
    if (!name){ toast("What is their name?", true); return; }
    if (!/^\d{4}$/.test(pin)){ toast("The PIN must be four numbers.", true); return; }
    if (pin !== pin2){ toast("The two PINs do not match.", true); return; }
    if (DB.users.length >= 5){ toast("Five logins is the limit.", true); return; }
    const u = await makeUser(name, $("#auRole").value, pin);
    DB.users.push(u);
    audit("create","Users",u.id,"Added "+name+" as "+u.role,"","","");
    await persist(); closeModal(); RENDER.settings(); toast(name+" can now sign in");
  };
}
function removeUser(id){
  const u = DB.users.find(x=>x.id===id);
  openModal("Remove "+u.name+"?", `
    <div class="note">${esc(u.name)} will not be able to sign in again. Everything they recorded stays in the
    books and in the audit trail — nothing is erased.</div>`,
    `<button class="btn ghost" onclick="closeModal()">Keep the login</button>
     <button class="btn danger" onclick="doRemoveUser('${id}')">Remove the login</button>`);
}
function doRemoveUser(id){
  const u = DB.users.find(x=>x.id===id);
  saveAnd(()=>{ DB.users = DB.users.filter(x=>x.id!==id);
    audit("delete","Users",id,"Removed the login for "+u.name,u.role,"",""); }, u.name+" removed");
  closeModal(); RENDER.settings();
}
function changePinDialog(){
  openModal("Change my PIN", `
    <div class="f"><label>PIN you use now</label><input id="cpOld" class="num" inputmode="numeric" maxlength="4" type="password"></div>
    <div class="frow">
      <div class="f"><label>New PIN</label><input id="cpNew" class="num" inputmode="numeric" maxlength="4" type="password"></div>
      <div class="f"><label>Type it again</label><input id="cpNew2" class="num" inputmode="numeric" maxlength="4" type="password"></div>
    </div>
    <div class="note">Nobody can recover a forgotten PIN for you. Write the new one somewhere safe.</div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn gold" id="cpSave">Change it</button>`);
  $("#cpSave").onclick = async () => {
    const u = DB.users.find(x=>x.id===DB.session.userId);
    if (!u){ toast("No login is active.", true); return; }
    const old = $("#cpOld").value.trim(), nw = $("#cpNew").value.trim(), nw2 = $("#cpNew2").value.trim();
    if (await hashPin(old, u.salt, u.hash[0]) !== u.hash){ toast("Your current PIN is not right.", true); return; }
    if (!/^\d{4}$/.test(nw)){ toast("The new PIN must be four numbers.", true); return; }
    if (nw !== nw2){ toast("The two new PINs do not match.", true); return; }
    u.salt = uid()+uid(); u.hash = await hashPin(nw, u.salt);
    audit("edit","Users",u.id,"Changed own PIN","","","");
    await persist(); closeModal(); toast("PIN changed");
  };
}

function doBackup(){
  const blob = new Blob([JSON.stringify({ app:"SMEBiz Zimbabwe", version:1, at:new Date().toISOString(), db:DB }, null, 1)],
    { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "smebiz-backup-" + today() + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  audit("backup","Settings","","Backup created","","","");
  persist(); toast("Backup saved to your downloads");
}
function doRestore(e){
  const file = e.target.files[0]; if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      if (!data.db || !data.db.journal) throw new Error("bad file");
      openModal("Restore this backup?", `<div class="note">Everything currently on this device will be replaced with the
        backup from ${esc((data.at||"").slice(0,10))}. This cannot be undone.</div>`,
        `<button class="btn ghost" onclick="closeModal()">Cancel</button>
         <button class="btn danger" id="rsGo">Replace my records</button>`);
      $("#rsGo").onclick = async () => {
        DB = data.db; migrate();
        audit("restore","Settings","","Backup restored","","","");
        await persist(); closeModal();
        if (DB.users.length) showLock(); else boot(true);
        toast("Backup restored");
      };
    } catch(err){ toast("That file is not a SMEBiz backup.", true); }
  };
  fr.readAsText(file);
}
async function hardReset(){ await Store.wipe(); closeModal(); await startDemo(); }

/* ---------------------------------------------------------------- AUDIT */
RENDER.audit = function(){
  const rows = DB.audit.slice(-200).reverse();
  $("#v-audit").innerHTML = `
    <div class="pagehead"><div><h2>Audit trail</h2><p>Every change, who made it and when. Nothing is ever quietly deleted.</p></div>
      <span class="grow"></span><button class="btn ghost sm" onclick="go('settings')">Back</button></div>
    <div class="card"><div class="bd" style="padding:0"><div class="scroll"><table class="tbl">
      <thead><tr><th>When</th><th>Who</th><th>What happened</th><th>Was</th><th>Became</th><th>Reason</th></tr></thead>
      <tbody>${rows.map(a=>`<tr>
        <td>${esc(new Date(a.at).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}))}</td>
        <td>${esc(a.user)}</td><td>${esc(a.detail)}${a.refId?`<div class="ref">${esc(a.refId)}</div>`:""}</td>
        <td>${esc(a.old)}</td><td>${esc(a.neu)}</td><td>${esc(a.reason)}</td></tr>`).join("")}</tbody>
    </table></div></div></div>`;
};

/* ---------------------------------------------------------------- SEARCH & ALERTS */
function globalSearch(){
  openModal("Search everything", `
    <div class="searchbar" style="margin:0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="gsIn" placeholder="Product, customer, supplier or reference like SALE-…" autocomplete="off"></div>
    <div id="gsOut" style="margin-top:12px"></div>`);
  $("#gsIn").oninput = () => {
    const q = $("#gsIn").value.trim().toLowerCase();
    if (q.length < 2){ $("#gsOut").innerHTML = ""; return; }
    const hits = [];
    for (const p of DB.products) if ((p.name+p.code).toLowerCase().includes(q))
      hits.push(["Product", p.name, qty(Biz.stockOf(p.id))+" in stock &middot; "+money(p.sell)]);
    for (const c of DB.customers) if (c.name.toLowerCase().includes(q))
      hits.push(["Customer", c.name, "owes "+money(Biz.customerBalance(c.id))]);
    for (const s of DB.suppliers) if (s.name.toLowerCase().includes(q))
      hits.push(["Supplier", s.name, "you owe "+money(Biz.supplierBalance(s.id))]);
    for (const j of DB.journal) if (j.ref.toLowerCase().includes(q) || j.narration.toLowerCase().includes(q))
      hits.push(["Transaction", j.ref, niceDate(j.date)+" &middot; "+j.narration+" &middot; "+money(j.total)]);
    $("#gsOut").innerHTML = hits.length
      ? hits.slice(0,25).map(h=>`<div class="kv"><span><span class="pill info">${h[0]}</span> ${esc(h[1])}</span>
          <b style="font-weight:500;font-size:12.5px;color:var(--muted)">${h[2]}</b></div>`).join("")
      : `<div class="empty">Nothing matches that.</div>`;
  };
  setTimeout(()=>$("#gsIn").focus(), 60);
}
function showAlerts(){
  const low = Biz.lowStock();
  const owed = DB.customers.map(c=>({c,b:Biz.customerBalance(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
  const over = owed.filter(x=>x.b > (x.c.limit||0));
  const lastBackup = [...DB.audit].reverse().find(a=>a.action==="backup");
  openModal("Things to look at", `
    ${low.length?`<div class="wrap-title" style="margin-top:0">Running low</div>${low.slice(0,8).map(x=>
      `<div class="kv"><span>${esc(x.p.name)}</span><b>${x.q<=0?"none left":qty(x.q)+" "+esc(x.p.unit)}</b></div>`).join("")}`:""}
    ${over.length?`<div class="wrap-title">Over their credit limit</div>${over.map(x=>
      `<div class="kv"><span>${esc(x.c.name)}</span><b>${money(x.b)} of ${money(x.c.limit)}</b></div>`).join("")}`:""}
    <div class="wrap-title">Backups</div>
    <div class="${lastBackup?"plain":"note"}">${lastBackup
      ? "Last backup: "+esc(new Date(lastBackup.at).toLocaleString("en-GB"))
      : "You have never backed up. Go to Settings and back up onto a flash drive or phone."}</div>
    ${!low.length && !over.length ? `<div class="empty" style="padding-top:18px">Nothing else needs your attention.</div>`:""}`);
}

/* ---------------------------------------------------------------- QUOTATIONS */
RENDER.quotes = function(){
  const rows = DB.quotes.slice().sort((a,b)=> a.date<b.date?1:-1);
  const open = rows.filter(q=>Biz.quoteStatus(q)==="open");
  $("#v-quotes").innerHTML = `
    <div class="pagehead"><div><h2>Quotations</h2>
      <p>${open.length ? open.length+" still waiting on an answer, worth "+money(r2(open.reduce((s,q)=>s+q.total,0))) : "Nothing outstanding."}</p></div>
      <span class="grow"></span><button class="btn ghost sm" onclick="go('dash')">Back</button>
      <button class="btn sm" onclick="go('sale')">Build a new one</button></div>
    <div class="card"><div class="bd" style="padding:0">${rows.length ? `<div class="scroll"><table class="tbl">
      <thead><tr><th>Reference</th><th>For</th><th>Given</th><th>Good until</th><th class="r">Amount</th><th></th></tr></thead>
      <tbody>${rows.map(q=>{
        const st = Biz.quoteStatus(q);
        const pill = st==="open" ? `<span class="pill warn">Waiting</span>`
          : st==="accepted" ? `<span class="pill ok">Became a sale</span>`
          : st==="expired" ? `<span class="pill info">Out of date</span>` : `<span class="pill bad">Turned down</span>`;
        return `<tr><td class="ref">${esc(q.ref)}</td>
          <td>${q.customerId?esc(Biz.customer(q.customerId).name):"Walk-in"} ${pill}</td>
          <td>${niceDate(q.date)}</td><td>${niceDate(q.validUntil)}</td>
          <td class="r">${money(q.total)}</td>
          <td class="r"><button class="btn ghost sm" data-q="${q.id}">Open</button></td></tr>`;
      }).join("")}</tbody></table></div>`
      : `<div class="empty"><div class="big">No quotations yet</div>
         Build a sale as normal, then choose <b>Save as a quote</b> instead of taking money.
         <div style="margin-top:14px"><button class="btn gold" onclick="go('sale')">Start one</button></div></div>`}
    </div></div>`;
  $$("#v-quotes [data-q]").forEach(b => b.onclick = () => openQuote(b.dataset.q));
};
function openQuote(id){
  const q = DB.quotes.find(x=>x.id===id), st = Biz.quoteStatus(q);
  openModal("Quotation "+q.ref, `
    <p class="ref">${niceDate(q.date)} &middot; good until ${niceDate(q.validUntil)} &middot; ${esc(q.user)}</p>
    ${q.customerId?`<div class="kv"><span>For</span><b style="font-weight:500">${esc(Biz.customer(q.customerId).name)}</b></div>`:""}
    ${q.items.map(i=>`<div class="kv"><span>${esc(i.name)} &times; ${qty(i.qty)} @ ${money(i.price)}</span><b>${money(i.net)}</b></div>`).join("")}
    ${q.discount?`<div class="kv"><span>Discount offered</span><b>-${money(q.discount)}</b></div>`:""}
    <div class="ln total"><span class="lbl">Total quoted</span><span class="dots"></span><span class="amt num">${money(q.total)}</span></div>
    ${q.note?`<p style="margin:12px 0 0;font-size:13.5px;color:var(--muted)">${esc(q.note)}</p>`:""}
    ${q.saleRef?`<div class="plain" style="margin-top:14px">Became sale ${esc(q.saleRef)}.</div>`:""}
    <div class="btnrow" style="margin-top:14px">
      ${st==="open"&&can("sale")?`<button class="btn gold sm" onclick="convertQuote('${q.id}')">They said yes — turn it into a sale</button>`:""}
      ${st==="open"?`<button class="btn ghost sm" onclick="rejectQuote('${q.id}')">They said no</button>`:""}
      ${st==="expired"&&can("quote")?`<button class="btn ghost sm" onclick="renewQuote('${q.id}')">Extend by 14 days</button>`:""}
      <button class="btn ghost sm no-print" onclick="window.print()">Print</button>
    </div>`);
}
function convertQuote(id){
  const q = DB.quotes.find(x=>x.id===id);
  const gone = q.items.filter(i=>{ const p = Biz.product(i.productId);
    return p && p.type==="good" && Biz.stockOf(p.id) < i.qty; });
  CART = { ...freshCart(), items:q.items.map(i=>({ productId:i.productId, qty:i.qty, price:i.price, discount:i.discount })),
           customerId:q.customerId, discount:q.discount, fromQuote:q.id };
  closeModal(); go("sale");
  if (gone.length) toast("Careful: not enough stock of "+gone.map(g=>Biz.product(g.productId).name).join(", "), true);
  else toast("Quoted prices loaded — take the payment");
}
function rejectQuote(id){
  const q = DB.quotes.find(x=>x.id===id);
  saveAnd(()=>{ q.status = "rejected"; audit("edit","Quotations",q.ref,"Quote turned down","open","rejected",""); }, "Marked as turned down");
  closeModal(); RENDER.quotes();
}
function renewQuote(id){
  const q = DB.quotes.find(x=>x.id===id);
  saveAnd(()=>{ const old = q.validUntil; q.validUntil = addDays(today(),14);
    audit("edit","Quotations",q.ref,"Quote extended", old, q.validUntil, ""); }, "Extended by 14 days");
  closeModal(); RENDER.quotes();
}

/* ---------------------------------------------------------------- RETURNS */
RENDER.returns = function(){
  const sales = DB.sales.slice(-25).reverse();
  const purs = DB.purchases.slice(-25).reverse();
  $("#v-returns").innerHTML = `
    <div class="pagehead"><div><h2>Returns</h2><p>Goods coming back from customers, or going back to a supplier.</p></div>
      <span class="grow"></span><button class="btn ghost sm" onclick="go('dash')">Back</button></div>
    <div class="plain">Nothing is ever deleted. A return is recorded as its own transaction against the original one,
    so both stay in the records and the stock, money and accounts all move together.</div>
    <div style="height:14px"></div>
    <div class="grid2">
      ${can("sale_return")?`<div class="card"><div class="hd"><h3>Customer bringing goods back</h3></div>
        <div class="bd" style="padding:0"><div class="scroll"><table class="tbl">
          <thead><tr><th>Sale</th><th>Date</th><th class="r">Amount</th><th></th></tr></thead>
          <tbody>${sales.map(s=>`<tr><td class="ref">${esc(s.ref)}</td><td>${niceDate(s.date)}</td>
            <td class="r">${money(s.net)}</td>
            <td class="r"><button class="btn ghost sm" data-rs="${s.id}">Bring back</button></td></tr>`).join("")}</tbody>
        </table></div></div></div>`:""}
      ${can("purchase_return")?`<div class="card"><div class="hd"><h3>Sending goods back to a supplier</h3></div>
        <div class="bd" style="padding:0"><div class="scroll"><table class="tbl">
          <thead><tr><th>Purchase</th><th>Supplier</th><th class="r">Amount</th><th></th></tr></thead>
          <tbody>${purs.map(p=>`<tr><td class="ref">${esc(p.ref)}<div class="ref">${niceDate(p.date)}</div></td>
            <td>${p.supplierId?esc(Biz.supplier(p.supplierId).name):"Not recorded"}</td>
            <td class="r">${money(p.total)}</td>
            <td class="r"><button class="btn ghost sm" data-rp="${p.id}">Send back</button></td></tr>`).join("")}</tbody>
        </table></div></div></div>`:""}
    </div>
    ${(DB.returns.length || DB.purchaseReturns.length) ? `<div class="card"><div class="hd"><h3>Already returned</h3></div>
      <div class="bd" style="padding:0"><div class="scroll"><table class="tbl">
        <thead><tr><th>Reference</th><th>Against</th><th>Date</th><th>Reason</th><th class="r">Amount</th></tr></thead>
        <tbody>${DB.returns.map(r=>`<tr><td class="ref">${esc(r.ref)}</td><td>${esc(r.saleRef)} <span class="pill info">from customer</span></td>
          <td>${niceDate(r.date)}</td><td>${esc(r.reason||"—")}</td><td class="r">${money(r.net)}</td></tr>`).join("")}
        ${DB.purchaseReturns.map(r=>`<tr><td class="ref">${esc(r.ref)}</td><td>${esc(r.purchaseRef)} <span class="pill gold">to supplier</span></td>
          <td>${niceDate(r.date)}</td><td>${esc(r.reason||"—")}</td><td class="r">${money(r.value)}</td></tr>`).join("")}
        </tbody></table></div></div></div>` : ""}`;
  $$("#v-returns [data-rs]").forEach(b => b.onclick = () => returnDialog(b.dataset.rs));
  $$("#v-returns [data-rp]").forEach(b => b.onclick = () => purchaseReturnDialog(b.dataset.rp));
};
function purchaseReturnDialog(id){
  const p = DB.purchases.find(x=>x.id===id);
  openModal("Send goods back to "+(p.supplierId?Biz.supplier(p.supplierId).name:"the supplier"), `
    <div class="plain">Against purchase ${esc(p.ref)} of ${niceDate(p.date)}.
    ${p.method==="credit" ? "This will reduce what you owe them." : "This will put the money back into your "+esc(PAY_NAME[p.method].toLowerCase())+"."}</div>
    ${p.items.map((i,ix)=>{
      const back = Biz.returnedToSupplier(p.id, i.productId);
      const left = r2(i.qty - back);
      return `<div class="f" style="margin-top:12px"><label>${esc(i.name)} — ${qty(left)} of ${qty(i.qty)} still returnable at ${money(i.cost)}</label>
        <input class="num" data-pret="${ix}" data-pid="${i.productId}" inputmode="decimal" value="0" ${left<=0?"disabled":""}></div>`;
    }).join("")}
    <div class="f"><label>Why is it going back?</label><input id="prWhy" placeholder="e.g. expired, wrong item delivered, damaged"></div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn gold" id="prSave">Record the return</button>`);
  $("#prSave").onclick = () => {
    const picks = $$("[data-pret]").map(el=>({ productId:el.dataset.pid, qty:Number(el.value)||0 }));
    if (saveAnd(()=>Biz.returnPurchase(p.id, picks, $("#prWhy").value.trim()), "Sent back and recorded")){
      closeModal(); RENDER.returns(); }
  };
}

/* ---------------------------------------------------------------- BOOT */
function migrate(){
  /* A backup taken from an earlier build may be missing newer collections. */
  DB.quotes = DB.quotes || [];
  DB.purchaseReturns = DB.purchaseReturns || [];
  DB.users = DB.users || [];
  DB.recon = DB.recon || [];
  DB.stockTakes = DB.stockTakes || [];
  DB.scenarios = DB.scenarios || [];
  DB.session = DB.session || { user:"Owner", userId:null, role:"Owner" };
  DB.session.role = DB.session.role || "Owner";
}
function applyPermissions(){
  $$("#nav button").forEach(b => {
    const need = VIEW_PERM[b.dataset.go];
    b.hidden = !!(need && !can(need));
  });
  $("#topUser").textContent = DB.session.user + " · " + DB.session.role;
}
function boot(loaded){
  migrate();
  $("#topBiz").textContent = DB.business.name;
  applyPermissions();
  const start = can("sale") || DB.session.role === "Owner" ? "dash" : "dash";
  go(loaded ? start : VIEW);
}
$$("#nav button").forEach(b => b.onclick = () => go(b.dataset.go));
$("#mClose").onclick = closeModal;
$("#scrim").onclick = e => { if (e.target === $("#scrim")) closeModal(); };
$("#btnSearch").onclick = globalSearch;
$("#btnAlerts").onclick = showAlerts;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

(async function start(){
  const saved = await Store.load();
  if (saved && saved.journal){
    DB = saved; migrate();
    if (DB.users.length) showLock();          // everyone signs in with their own PIN
    else boot(true);
  } else {
    DB = freshDB();                            // a shell so the wizard can render
    showSetup();
  }
})();
//__END__
</script>
