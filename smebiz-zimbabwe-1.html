<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2342">
<title>SMEBiz Zimbabwe</title>
<!--
  SMEBiz Zimbabwe — offline-first SME business management & accounting system.
  Single file. No external fonts, no CDNs, no network calls of any kind.
  Ships as: browser page | Tauri/Electron desktop shell | Android WebView (Capacitor/Kotlin).
  Storage is abstracted behind Store.* so SQLite/Room can replace it without touching business logic.
-->
<style>
:root{
  --navy:#0A2342; --navy-deep:#071A33; --navy-soft:#14345F; --navy-line:#1E4372;
  --gold:#C9A227; --gold-bright:#E8B93B; --gold-pale:#F6EBC4;
  --white:#FFFFFF; --paper:#F5F7FA; --card:#FFFFFF;
  --ink:#12213A; --muted:#5C6B84; --faint:#8B99AE;
  --line:#E1E6EE; --line-soft:#EFF2F7;
  --up:#1B7A4B; --up-bg:#E7F4EC; --down:#B02A24; --down-bg:#FBEAE9; --watch:#B07908; --watch-bg:#FDF3DC;
  --shadow:0 1px 2px rgba(10,35,66,.06), 0 8px 24px rgba(10,35,66,.07);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold-bright); outline-offset:2px}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}

/* ---------- shell ---------- */
#app{max-width:1180px;margin:0 auto;background:var(--paper);min-height:100vh;
     display:flex;flex-direction:column;padding-bottom:76px}
.topbar{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:11px;
        position:sticky;top:0;z-index:40;border-bottom:3px solid var(--gold)}
.topbar .mark{flex:0 0 auto}
.topbar h1{font:600 15px/1.15 var(--sans);margin:0;letter-spacing:.2px}
.topbar .biz{font:italic 400 13px/1.3 var(--serif);color:var(--gold-bright);margin:0}
.topbar .whoami{font:500 11px/1.3 var(--sans);color:#93A7C4;margin:1px 0 0}
.nav button[hidden]{display:none}
.topbar .grow{flex:1}
.iconbtn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:#fff;
         border-radius:8px;width:38px;height:38px;display:grid;place-items:center;font-size:15px}
.iconbtn:hover{background:rgba(255,255,255,.2)}
main{flex:1;padding:14px 14px 24px}
.view{display:none;animation:none}
.view.on{display:block}

/* ---------- page furniture ---------- */
.pagehead{display:flex;align-items:flex-end;gap:12px;margin:2px 0 14px}
.pagehead h2{font:600 21px/1.2 var(--sans);margin:0;letter-spacing:-.2px}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pagehead .grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.card .hd{padding:11px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.card .hd h3{margin:0;font:600 14px/1.2 var(--sans)}
.card .hd .grow{flex:1}
.card .bd{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- the cash-book panel (signature element) ---------- */
.cashbook{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
          overflow:hidden;box-shadow:var(--shadow)}
.cashbook .band{background:var(--navy);color:#fff;padding:13px 16px;border-bottom:3px solid var(--gold)}
.cashbook .band .d{font:400 12px/1.3 var(--sans);color:#A9BCD8}
.cashbook .band .t{font:600 16px/1.25 var(--sans);letter-spacing:.2px}
.cbgroup{padding:6px 16px 12px}
.cbgroup+.cbgroup{border-top:1px solid var(--line-soft)}
.cbcap{font:italic 400 13px/1 var(--serif);color:var(--muted);padding:12px 0 8px}
.ln{display:flex;align-items:baseline;gap:6px;padding:6px 0}
.ln .lbl{color:var(--ink);font-size:14px;white-space:nowrap}
.ln .dots{flex:1;border-bottom:1px dotted #C4CDDC;transform:translateY(-4px);min-width:14px}
.ln .amt{font:600 16px/1 var(--sans);white-space:nowrap;font-variant-numeric:tabular-nums}
.ln.lead .lbl{font-weight:600}
.ln.lead .amt{font-size:21px}
.ln.total{border-top:2px solid var(--navy);margin-top:6px;padding-top:10px}
.ln.total .lbl{font-weight:700}
.ln.total .amt{font-size:22px}
.pos{color:var(--up)} .neg{color:var(--down)} .neu{color:var(--ink)}
.sub{font-size:12px;color:var(--faint);margin:-3px 0 0}

/* ---------- quick actions ---------- */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
@media(max-width:520px){.qa{grid-template-columns:repeat(2,1fr)}}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;
  display:flex;flex-direction:column;align-items:center;gap:7px;font:600 13px/1.2 var(--sans);
  color:var(--navy);box-shadow:var(--shadow);min-height:78px;justify-content:center;transition:border-color .12s,transform .12s}
.qa button:hover{border-color:var(--gold);transform:translateY(-1px)}
.qa button:active{transform:translateY(0)}
.qa button .g{width:34px;height:34px;border-radius:8px;background:var(--navy);color:var(--gold-bright);
  display:grid;place-items:center;font-size:16px}
.qa button.hero .g{background:var(--gold);color:var(--navy)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;
     padding:9px 15px;font:600 14px/1.2 var(--sans)}
.btn:hover{background:var(--navy-soft)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy-deep)}
.btn.gold:hover{background:var(--gold-bright)}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy);background:#F2F5FA}
.btn.danger{background:var(--down);border-color:var(--down)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.wide{width:100%;padding:14px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- forms ---------- */
.f{margin-bottom:12px}
.f>label{display:block;font:600 12.5px/1.2 var(--sans);color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:8px;background:#fff;font-size:15px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(10,35,66,.10)}
.f .hint{font-size:12px;color:var(--faint);margin-top:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.frow{grid-template-columns:1fr}}
.money-in{position:relative}
.money-in span{position:absolute;left:12px;top:11px;color:var(--faint)}
.money-in input{padding-left:26px;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:#fff;border:0;padding:10px 6px;font:600 13px/1.2 var(--sans);color:var(--muted);
  border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.check{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 0}
.check input{width:19px;height:19px;accent-color:var(--navy)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font:600 12px/1.3 var(--sans);color:var(--muted);
        padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.2px}
.tbl td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr:hover{background:#FAFBFD}
.tbl tr.grand td{border-top:2px solid var(--navy);font-weight:700;background:#FAFBFD}
.tbl tr.sect td{background:#F2F5FA;font-weight:600;font-size:12.5px;color:var(--navy)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wrap-title{font:600 13px/1.2 var(--sans);margin:18px 0 7px;color:var(--navy)}

/* ---------- misc atoms ---------- */
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font:600 11.5px/1.6 var(--sans);white-space:nowrap}
.pill.ok{background:var(--up-bg);color:var(--up)} .pill.bad{background:var(--down-bg);color:var(--down)}
.pill.warn{background:var(--watch-bg);color:var(--watch)} .pill.info{background:#EAF0F8;color:var(--navy-soft)}
.pill.gold{background:var(--gold-pale);color:#7A6210}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:6px}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .big{font:600 15px/1.3 var(--sans);color:var(--ink);margin-bottom:5px}
.ref{font:500 12px/1 var(--sans);color:var(--faint);letter-spacing:.3px;font-variant-numeric:tabular-nums}
.searchbar{position:relative;margin-bottom:12px}
.searchbar input{width:100%;padding:12px 12px 12px 36px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff}
.searchbar svg{position:absolute;left:11px;top:12px;opacity:.45}
.note{background:var(--gold-pale);border:1px solid #E6D28A;border-radius:8px;padding:11px 13px;font-size:13.5px;color:#5E4C09}
.plain{background:#EAF0F8;border:1px solid #CFDCEC;border-radius:8px;padding:11px 13px;font-size:13.5px;color:var(--navy)}
.hr{height:1px;background:var(--line-soft);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy)}
.bar i.over{background:var(--down)}
.bar i.good{background:var(--up)}

/* ---------- cart ---------- */
.cart{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cart .row{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-soft);align-items:center}
.cart .row:last-child{border-bottom:0}
.cart .row .nm{flex:1;min-width:0}
.cart .row .nm b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart .row .nm span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cart .row .amt{font-weight:600;font-variant-numeric:tabular-nums}
.cart .row .x{background:none;border:0;color:var(--down);font-size:17px;padding:2px 5px;line-height:1}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.stepper button{border:0;background:#F4F6FA;width:30px;height:30px;font-size:16px;color:var(--navy);line-height:1}
.stepper input{width:42px;border:0;text-align:center;padding:6px 0;font-variant-numeric:tabular-nums;font-size:14px}
.picklist{max-height:246px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.picklist button{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line-soft);
  padding:11px 12px;display:flex;gap:10px;align-items:center}
.picklist button:hover{background:#F2F5FA}
.picklist button:last-child{border-bottom:0}
.picklist .nm{flex:1}
.picklist .nm b{display:block;font-size:14px;font-weight:600}
.picklist .nm span{font-size:12px;color:var(--muted)}
.picklist .pr{font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(7,26,51,.55);display:none;z-index:60;
       align-items:flex-end;justify-content:center;padding:0}
.scrim.on{display:flex}
@media(min-width:700px){.scrim{align-items:center;padding:24px}}
.modal{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;
       border-radius:14px 14px 0 0;box-shadow:0 -8px 40px rgba(7,26,51,.3)}
@media(min-width:700px){.modal{border-radius:12px}}
.modal .mh{position:sticky;top:0;background:var(--navy);color:#fff;padding:13px 16px;
  display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);z-index:2}
.modal .mh h3{margin:0;font:600 15px/1.2 var(--sans);flex:1}
.modal .mh button{background:rgba(255,255,255,.14);border:0;color:#fff;width:30px;height:30px;border-radius:7px;font-size:16px}
.modal .mb{padding:16px}
.modal .mf{padding:12px 16px 18px;border-top:1px solid var(--line-soft);
  position:sticky;bottom:0;background:#fff;display:flex;gap:10px}
.modal .mf .btn{flex:1}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:3px solid var(--gold);
     display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:1180px;margin:0 auto;display:flex;width:100%}
.nav button{flex:1;background:none;border:0;color:#93A7C4;padding:8px 2px 9px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px/1.2 var(--sans)}
.nav button.on{color:var(--gold-bright)}
.nav button.on .ic{background:rgba(232,185,59,.16)}
.nav .ic{width:30px;height:24px;display:grid;place-items:center;border-radius:7px;font-size:14px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:90;
  background:var(--navy-deep);color:#fff;padding:11px 17px;border-radius:9px;font-size:14px;
  box-shadow:0 8px 30px rgba(7,26,51,.35);display:none;max-width:90vw;text-align:center;
  border-left:4px solid var(--gold)}
#toast.bad{border-left-color:var(--down)}
#toast.on{display:block}

/* ---------- report sheet ---------- */
.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.sheet .shead{display:flex;gap:12px;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:14px}
.sheet .shead .t{flex:1}
.sheet .shead h3{margin:0;font:600 17px/1.2 var(--serif)}
.sheet .shead .m{font-size:12.5px;color:var(--muted);margin-top:3px}
.sheet h4{font:600 13px/1.2 var(--sans);color:var(--navy);margin:18px 0 6px;
  padding-bottom:5px;border-bottom:1px solid var(--line)}
.sheet .foot{margin-top:18px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;gap:10px}
.finding{border-left:4px solid var(--line);padding:11px 0 11px 14px;margin-top:14px}
.finding b{display:block;font:600 14.5px/1.35 var(--sans);margin-bottom:3px}
.finding p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.finding.good{border-left-color:var(--up)}
.finding.watch{border-left-color:var(--watch)}
.finding.bad{border-left-color:var(--down)}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font:600 13px/1.2 var(--sans);color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.lab-out{background:var(--navy);color:#fff;border-radius:var(--r);padding:16px;border-top:3px solid var(--gold)}
.lab-out .kv{border-bottom-color:rgba(255,255,255,.12);color:#DCE5F1}
.lab-out .kv b{color:#fff}
.lab-out .stamp{font:600 11px/1.2 var(--sans);color:var(--navy-deep);background:var(--gold-bright);
  display:inline-block;padding:4px 9px;border-radius:5px;margin-bottom:12px}

.full{position:fixed;inset:0;background:var(--navy);z-index:80;overflow-y:auto;display:flex;
      align-items:center;justify-content:center;padding:22px}
.full[hidden]{display:none}
.panel{background:#fff;border-radius:14px;width:100%;max-width:470px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.panel .ph{background:var(--navy-deep);color:#fff;padding:20px;border-bottom:3px solid var(--gold);text-align:center}
.panel .ph h2{margin:8px 0 2px;font:600 19px/1.2 var(--sans)}
.panel .ph p{margin:0;font:italic 400 13.5px/1.4 var(--serif);color:var(--gold-bright)}
.panel .pb{padding:18px}
.userpick{display:grid;gap:9px}
.userpick button{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);
  background:#fff;border-radius:10px;text-align:left;width:100%}
.userpick button:hover{border-color:var(--gold)}
.userpick .who b{display:block;font-size:14.5px}
.userpick .who span{font-size:12.5px;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:99px;background:var(--navy);color:var(--gold-bright);
  display:grid;place-items:center;font:700 15px/1 var(--sans);flex:0 0 auto}
.pinrow{display:flex;gap:10px;justify-content:center;margin:16px 0 18px}
.pindot{width:15px;height:15px;border-radius:99px;border:2px solid var(--navy)}
.pindot.on{background:var(--navy)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pad button{padding:15px 0;font:600 21px/1 var(--sans);border:1px solid var(--line);background:#fff;
  border-radius:10px;color:var(--navy);font-variant-numeric:tabular-nums}
.pad button:hover{background:#F2F5FA}
.pad button.alt{font-size:14px;font-weight:600;color:var(--muted)}
.steps{display:flex;gap:5px;margin-bottom:16px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--gold)}
.savewarn{background:#FBEAE9;border-bottom:1px solid #E9B3AF;color:#7A1E19;padding:10px 14px;font-size:13px;line-height:1.4}
.savewarn[hidden]{display:none}
.linkbtn{background:none;border:0;padding:0;color:#7A1E19;font:inherit;text-decoration:underline}
@media print{
  .topbar,.nav,.savewarn,.qa,.pagehead,.chips,.no-print,#toast{display:none !important}
  #app{padding:0;max-width:none}
  main{padding:0}
  body{background:#fff}
  .sheet{border:0;box-shadow:none;padding:0}
  .view{display:none !important}
  .view.on{display:block !important}
}
@media print{
  body.modal-open #app{display:none !important}
  .scrim.on{position:static;display:block;background:#fff;padding:0}
  .scrim.on .modal{max-width:none;max-height:none;overflow:visible;box-shadow:none;border-radius:0}
  .scrim.on .mh{position:static;background:#fff;color:var(--ink);border-bottom:2px solid var(--navy)}
  .scrim.on .mh button,.scrim.on .mf{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div id="app">

  <header class="topbar">
    <span class="mark" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 64 64" role="img">
        <path d="M32 3 58 12v22c0 14-11 24-26 27C17 58 6 48 6 34V12L32 3Z" fill="#0A2342" stroke="#C9A227" stroke-width="3"/>
        <rect x="18" y="34" width="7" height="12" rx="1.5" fill="#E8B93B"/>
        <rect x="28.5" y="27" width="7" height="19" rx="1.5" fill="#E8B93B"/>
        <rect x="39" y="20" width="7" height="26" rx="1.5" fill="#FFFFFF"/>
        <path d="M32 11.5l2.1 4.4 4.8.7-3.5 3.4.8 4.8-4.2-2.3-4.2 2.3.8-4.8-3.5-3.4 4.8-.7L32 11.5Z" fill="#E8B93B"/>
      </svg>
    </span>
    <div>
      <h1>SMEBiz Zimbabwe</h1>
      <p class="biz" id="topBiz">Loading business…</p>
      <p class="whoami" id="topUser"></p>
    </div>
    <span class="grow"></span>
    <button class="iconbtn" id="btnSearch" title="Search everything" aria-label="Search everything">&#9906;</button>
    <button class="iconbtn" id="btnAlerts" title="Alerts" aria-label="Alerts">&#9873;</button>
  </header>

  <div id="saveWarn" class="savewarn" hidden>
    <b>Nothing is being saved on this device.</b> You can keep working, but close this page and today's entries are gone.
    Use <button class="linkbtn" onclick="go('settings')">Settings &rsaquo; Back up now</button> before you finish.
  </div>

  <main>
    <section class="view on" id="v-dash"></section>
    <section class="view" id="v-sale"></section>

<script>
"use strict";
/* ===========================================================================
   SMEBiz Zimbabwe
   Layer 1  Storage adapter      — swap for SQLite / Room without touching logic
   Layer 2  Accounting engine    — chart of accounts + double-entry journal
   Layer 3  Business operations  — sale, purchase, expense, payment, transfer…
   Layer 4  Interface            — plain language, no accounting words
   =========================================================================== */

/* ---------------------------------------------------------------- LAYER 1 */
const Store = (() => {
  const KEY = "smebiz.db.v1";
  let mem = null;
  let bridgeOk = true;                 // host-provided key/value store, if any
  let localOk  = true;                 // browser localStorage
  const bridge = () => bridgeOk && window.storage && typeof window.storage.set === "function" ? window.storage : null;

  async function tryBridgeSet(json){
    const b = bridge(); if (!b) return false;
    try { const r = await b.set(KEY, json); bridgeOk = true; return r !== null && r !== undefined; }
    catch(e){ bridgeOk = false; return false; }          // fail once, never spam the console again
  }
  function tryLocalSet(json){
    if (!localOk) return false;
    try { window.localStorage.setItem(KEY, json); return true; } catch(e){ localOk = false; return false; }
  }
  return {
    where: "memory",                    // "device" | "browser" | "memory"
    /* Desktop/Android build: replace the three methods below with SQLite reads and writes. */
    async load(){
      if (mem) return mem;
      const b = bridge();
      if (b){
        try { const r = await b.get(KEY); if (r && r.value){ mem = JSON.parse(r.value); this.where="device"; return mem; } }
        catch(e){ bridgeOk = false; }
      }
      try { const s = window.localStorage.getItem(KEY);
            if (s){ mem = JSON.parse(s); this.where="browser"; return mem; } }
      catch(e){ localOk = false; }
      return null;
    },
    async save(db){
      mem = db;
      const json = JSON.stringify(db);
      if (await tryBridgeSet(json)){ this.where = "device"; return true; }
      if (tryLocalSet(json)){ this.where = "browser"; return true; }
      this.where = "memory"; return false;
    },
    async wipe(){
      mem = null;
      const b = bridge(); if (b){ try{ await b.delete(KEY); }catch(e){} }
      try { window.localStorage.removeItem(KEY); } catch(e){}
    },
    safe(){ return this.where !== "memory"; }
  };
})();

/* ---------------------------------------------------------------- HELPERS */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((Number(n)||0)*100)/100;
const r4 = n => Math.round((Number(n)||0)*10000)/10000;
const jss = s => String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
const money = n => (n<0?"-":"") + "$" + Math.abs(r2(n)).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const qty = n => (Math.round((Number(n)||0)*1000)/1000).toLocaleString("en-US");
const today = () => new Date().toISOString().slice(0,10);
const monthOf = d => String(d).slice(0,7);
const uid = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const niceDate = d => { const t=new Date(d+"T00:00:00");
  return t.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };
const addDays = (d,n) => { const t=new Date(d+"T00:00:00"); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); };

/* ---------------------------------------------------------------- LAYER 2 */
/* Account types drive every report. NORMAL side: DR for asset/expense/cost. */
const ACCT = [
  ["1000","Cash in hand","asset","money"],
  ["1005","Cash in ZiG","asset","money-fx"],
  ["1010","Mobile money","asset","money"],
  ["1020","Bank account","asset","money"],
  ["1200","Money customers owe you","asset","ar"],
  ["1250","VAT you can claim back","asset","vat"],
  ["1300","Stock on hand","asset","inventory"],
  ["1500","Equipment","asset",""],
  ["2000","Money you owe suppliers","liability","ap"],
  ["2200","VAT you owe ZIMRA","liability","vat"],
  ["2100","Loans","liability",""],
  ["3000","Owner's money put in","equity",""],
  ["3100","Owner's money taken out","equity","drawings"],
  ["4000","Sales of goods","income",""],
  ["4100","Service income","income",""],
  ["4900","Other income","income",""],
  ["4910","Gain or loss on the ZiG rate","income",""],
  ["5000","Cost of items sold","cost",""],
  ["6010","Rent","expense",""],["6020","Electricity","expense",""],["6030","Water","expense",""],
  ["6040","Transport","expense",""],["6050","Fuel","expense",""],["6060","Wages and salaries","expense",""],
  ["6070","Airtime and data","expense",""],["6080","Advertising","expense",""],
  ["6090","Stationery","expense",""],["6100","Packaging","expense",""],["6110","Repairs","expense",""],
  ["6120","Bank charges","expense",""],["6130","Mobile money charges","expense",""],
  ["6140","Licences and permits","expense",""],["6150","Security","expense",""],
  ["6160","Damaged and expired stock","expense",""],["6170","Stock losses","expense",""],
  ["6900","Other expenses","expense",""]
];
const ACC_NAME = Object.fromEntries(ACCT.map(a=>[a[0],a[1]]));
const ACC_TYPE = Object.fromEntries(ACCT.map(a=>[a[0],a[2]]));
const PAY_ACC = { cash:"1000", zig:"1005", mobile:"1010", bank:"1020" };
/* VAT is configuration, never hard-coded. Off unless the business registers.
   Prices are treated as VAT-inclusive, which is how Zimbabwean retail actually prices. */
const vatRate = () => (DB && DB.settings && DB.settings.vatOn) ? (Number(DB.settings.vatRate)||0)/100 : 0;
const exVat   = amt => r2(r2(amt) / (1 + vatRate()));
const vatPart = amt => r2(r2(amt) - exVat(amt));
const PAY_NAME = { cash:"Cash (USD)", zig:"ZiG cash", mobile:"Mobile money", bank:"Bank", credit:"On credit" };
/* Which ways of paying are on offer. ZiG only appears once the owner turns it on. */
const payMethods = () => fxOn() ? ["cash","zig","mobile","bank"] : ["cash","mobile","bank"];

/* A second currency, Zimbabwe-style: you price in USD, take ZiG at the day's rate,
   and the notes in the till are worth whatever today's rate says they are.
   The books stay in one currency; the ZiG till is simply revalued when the rate moves. */
const fxOn   = () => !!(DB && DB.settings && DB.settings.fxOn);
const fxCode = () => (DB && DB.settings && DB.settings.fxCode) || "ZiG";
function fxRateOn(date){
  const hist = ((DB.settings||{}).fxHistory || []).filter(x => x.date <= (date || today()))
    .sort((a,b)=> a.date < b.date ? 1 : -1);
  return hist.length ? Number(hist[0].rate) : Number((DB.settings||{}).fxRate) || 0;
}
const toBase = (fxAmount, date) => { const r = fxRateOn(date); return r > 0 ? r2(fxAmount / r) : 0; };
const toFx   = (baseAmount, date) => r2(r2(baseAmount) * fxRateOn(date));
const fxUnits = () => r2(((DB||{}).fx || {}).units || 0);
const moneyHeld = upto => r2(["1000","1005","1010","1020"].reduce((s,a)=>s+Ledger.read(a, upto), 0));
function fxDelta(n){ DB.fx = DB.fx || { units:0 }; DB.fx.units = r2(DB.fx.units + r2(n)); }
function noteFx(payments, date, sign){
  for (const p of payments) if (p.method === "zig")
    fxDelta(sign * (p.fx ? p.fx.amount : toFx(p.amount, date)));
}

let DB = null;

const Ledger = {
  /* The only way money ever moves. Refuses to post if debits ≠ credits. */
  post(date, ref, narration, lines, meta){
    const clean = lines.filter(l => r2(l.dr||0) !== 0 || r2(l.cr||0) !== 0)
                       .map(l => ({ acc:l.acc, dr:r2(l.dr||0), cr:r2(l.cr||0) }));
    const dr = r2(clean.reduce((s,l)=>s+l.dr,0));
    const cr = r2(clean.reduce((s,l)=>s+l.cr,0));
    if (Math.abs(dr-cr) > 0.004) throw new Error("Entry does not balance: "+dr+" vs "+cr);
    if (!clean.length) throw new Error("Empty entry");
    const je = { id:uid(), date, ref, narration, lines:clean, total:dr,
                 user:DB.session.user, device:DB.settings.device, at:new Date().toISOString(),
                 ...(meta||{}) };
    DB.journal.push(je);
    return je;
  },
  balance(acc, upto){
    let b = 0;
    for (const je of DB.journal){
      if (upto && je.date > upto) continue;
      for (const l of je.lines) if (l.acc === acc) b += l.dr - l.cr;
    }
    return r2(b);                                   // debit-positive
  },
  /* Signed the way a human expects to read it. */
  read(acc, upto){
    const t = ACC_TYPE[acc], b = this.balance(acc, upto);
    if (acc === "3100") return b;                   // drawings sit on the debit side of equity
    return (t==="asset"||t==="expense"||t==="cost") ? b : r2(-b);
  },
  movement(acc, from, to){
    let dr=0, cr=0;
    for (const je of DB.journal){
      if (from && je.date < from) continue;
      if (to && je.date > to) continue;
      for (const l of je.lines) if (l.acc===acc){ dr+=l.dr; cr+=l.cr; }
    }
    const t = ACC_TYPE[acc];
    return (t==="asset"||t==="expense"||t==="cost") ? r2(dr-cr) : r2(cr-dr);
  },
  typeTotal(type, from, to){
    let s = 0;
    for (const a of ACCT) if (a[2]===type) s += this.movement(a[0], from, to);
    return r2(s);
  },
  entriesFor(acc){ return DB.journal.filter(j => j.lines.some(l=>l.acc===acc)); }
};

/* Audit: nothing financially meaningful is ever deleted, only reversed. */
function audit(action, module, refId, detail, oldV, newV, reason){
  DB.audit.push({ id:uid(), at:new Date().toISOString(), user:DB.session.user, action, module,
                  refId:refId||"", detail:detail||"", old:oldV==null?"":String(oldV),
                  neu:newV==null?"":String(newV), reason:reason||"", device:DB.settings.device });
}

function nextRef(prefix, date){
  const d = (date || today()).replace(/-/g,"");
  DB.counters[prefix] = (DB.counters[prefix]||0) + 1;
  return prefix + "-" + d + "-" + String(DB.counters[prefix]).padStart(6,"0");
}

/* ---------------------------------------------------------------- LAYER 3 */
const Biz = {
  product: id => DB.products.find(p=>p.id===id),
  customer: id => DB.customers.find(c=>c.id===id),
  supplier: id => DB.suppliers.find(s=>s.id===id),

  priceAt(prod, date){
    const hist = (prod.priceHistory||[]).filter(h=>h.from<=date).sort((a,b)=>a.from<b.from?1:-1);
    return hist.length ? hist[0].sell : prod.sell;
  },
  setPrice(prod, sell, buy, reason){
    const oldSell = prod.sell;
    prod.priceHistory = prod.priceHistory||[];
    prod.priceHistory.push({ from: today(), sell:r2(sell), buy:r2(buy) });
    prod.sell = r2(sell); prod.buy = r2(buy);
    audit("edit","Products",prod.id,"Selling price of "+prod.name,money(oldSell),money(sell),reason||"");
  },
  stockOf(id){
    let q = 0;
    for (const m of DB.stock) if (m.product===id) q += m.qty;
    return Math.round(q*1000)/1000;
  },
  avgCost(id){
    const p = this.product(id);
    return p ? r4(p.avgCost != null ? p.avgCost : p.buy) : 0;
  },
  stockValue(){
    return r2(DB.products.filter(p=>p.type==="good")
      .reduce((s,p)=>s + this.stockOf(p.id)*this.avgCost(p.id), 0));
  },
  moveStock(productId, q, kind, ref, note){
    DB.stock.push({ id:uid(), date:today(), product:productId, qty:r2(q), kind, ref, note:note||"",
                    user:DB.session.user, at:new Date().toISOString() });
  },
  customerBalance(id){
    let b = 0;
    const c = this.customer(id); if(!c) return 0;
    b += c.opening||0;
    for (const t of DB.custTx) if (t.customer===id) b += t.amount;
    return r2(b);
  },
  supplierBalance(id){
    let b = 0;
    const s = this.supplier(id); if(!s) return 0;
    b += s.opening||0;
    for (const t of DB.suppTx) if (t.supplier===id) b += t.amount;
    return r2(b);
  },
  /* Applies payments to the oldest charges first, then buckets what is left by age. */
  ageing(kind, id){
    const opening = kind==="c" ? (this.customer(id)||{}).opening : (this.supplier(id)||{}).opening;
    const tx = (kind==="c" ? DB.custTx.filter(t=>t.customer===id) : DB.suppTx.filter(t=>t.supplier===id))
      .slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
    const charges = [];
    const startDate = (DB.settings.created||today()).slice(0,10);
    if (r2(opening||0) > 0) charges.push({ date:startDate, left:r2(opening) });
    for (const t of tx){
      if (t.amount > 0){ charges.push({ date:t.date, left:r2(t.amount) }); continue; }
      let pay = r2(-t.amount);
      for (const c of charges){
        if (pay <= 0) break;
        const take = Math.min(c.left, pay);
        c.left = r2(c.left - take); pay = r2(pay - take);
      }
    }
    const out = { current:0, d30:0, d60:0, d90:0, total:0, oldest:null };
    const now = new Date(today()+"T00:00:00");
    for (const c of charges){
      if (c.left <= 0.004) continue;
      const days = Math.round((now - new Date(c.date+"T00:00:00")) / 86400000);
      if (days <= 30) out.current = r2(out.current + c.left);
      else if (days <= 60) out.d30 = r2(out.d30 + c.left);
      else if (days <= 90) out.d60 = r2(out.d60 + c.left);
      else out.d90 = r2(out.d90 + c.left);
      out.total = r2(out.total + c.left);
      if (!out.oldest || c.date < out.oldest) out.oldest = c.date;
    }
    return out;
  },
  totalOwedToYou(){ return r2(DB.customers.reduce((s,c)=>s+this.customerBalance(c.id),0)); },
  totalYouOwe(){ return r2(DB.suppliers.reduce((s,x)=>s+this.supplierBalance(x.id),0)); },

  /* ---------------- SALE ---------------- */
  recordSale({ date, items, payments, customerId, note }){
    date = date || today();
    let gross=0, disc=0, cogs=0;
    const lineRecs = items.map(it=>{
      const p = this.product(it.productId);
      const line = r2(it.qty * it.price);
      const d = r2(it.discount||0);
      gross = r2(gross+line); disc = r2(disc+d);
      let cost = 0;
      if (p.type === "good"){ cost = r2(it.qty * this.avgCost(p.id)); cogs = r2(cogs+cost); }
      else if (p.costEst){ cost = r2(it.qty * p.costEst); }
      return { productId:p.id, name:p.name, type:p.type, qty:it.qty, price:r2(it.price),
               discount:d, gross:line, net:r2(line-d), cost };
    });
    const net = r2(gross - disc);
    const paid = r2(payments.filter(p=>p.method!=="credit").reduce((s,p)=>s+p.amount,0));
    const credit = r2(net - paid);
    if (credit > 0.004 && !customerId) throw new Error("Choose the customer who is taking this on credit.");
    if (paid - net > 0.004) throw new Error("Payments are more than the sale total.");

    const ref = nextRef("SALE", date);
    const lines = [];
    for (const p of payments){ if (p.method!=="credit" && p.amount>0) lines.push({acc:PAY_ACC[p.method], dr:p.amount}); }
    if (credit > 0.004) lines.push({ acc:"1200", dr:credit });
    const vat = vatPart(net);
    const goodsGross = r2(lineRecs.filter(l=>l.type==="good").reduce((s,l)=>s+l.net,0));
    const goodsRev = r2(exVat(goodsGross));
    const servRev  = r2(net - vat - goodsRev);
    if (goodsRev) lines.push({ acc:"4000", cr:goodsRev });
    if (servRev)  lines.push({ acc:"4100", cr:servRev });
    if (vat)      lines.push({ acc:"2200", cr:vat });
    if (cogs > 0){ lines.push({ acc:"5000", dr:cogs }); lines.push({ acc:"1300", cr:cogs }); }
    Ledger.post(date, ref, "Sale" + (customerId ? " to " + this.customer(customerId).name : ""), lines, {module:"sale"});

    noteFx(payments, date, +1);
    for (const l of lineRecs) if (l.type==="good") this.moveStock(l.productId, -l.qty, "sale", ref);
    if (credit > 0.004) DB.custTx.push({ id:uid(), date, customer:customerId, ref, kind:"Credit sale", amount:credit });

    const sale = { id:uid(), ref, date, items:lineRecs, payments:payments.filter(p=>p.amount>0),
                   gross, discount:disc, net, vat, paid, credit, cogs, customerId:customerId||null,
                   note:note||"", user:DB.session.user, voided:false };
    DB.sales.push(sale);
    audit("create","Sales",ref,"Sale of "+money(net),"",money(net),"");
    return sale;
  },

  returnSale(saleId, picks, reason){
    const sale = DB.sales.find(s=>s.id===saleId);
    if (!sale) throw new Error("Sale not found.");
    const ref = nextRef("RET");
    let net=0, cost=0;
    const items = [];
    for (const pick of picks){
      if (!pick.qty) continue;
      const orig = sale.items.find(i=>i.productId===pick.productId);
      if (!orig) continue;
      const unitNet = orig.net / orig.qty;
      const amt = r2(unitNet * pick.qty);
      const c = orig.type==="good" ? r2(this.avgCost(orig.productId)*pick.qty) : 0;
      net = r2(net+amt); cost = r2(cost+c);
      items.push({ productId:orig.productId, name:orig.name, type:orig.type, qty:pick.qty, amount:amt, cost:c });
      if (orig.type==="good") this.moveStock(orig.productId, pick.qty, "sale-return", ref, reason);
    }
    if (!items.length) throw new Error("Nothing selected to bring back.");
    const lines = [];
    const rvat  = vatPart(net);
    const goods = r2(exVat(r2(items.filter(i=>i.type==="good").reduce((s,i)=>s+i.amount,0))));
    const serv  = r2(net - rvat - goods);
    if (goods) lines.push({acc:"4000", dr:goods});
    if (serv)  lines.push({acc:"4100", dr:serv});
    if (rvat)  lines.push({acc:"2200", dr:rvat});
    const onCredit = sale.credit > 0.004;
    if (onCredit){ lines.push({acc:"1200", cr:net});
      DB.custTx.push({ id:uid(), date:today(), customer:sale.customerId, ref, kind:"Goods returned", amount:-net }); }
    else lines.push({acc:PAY_ACC[(sale.payments[0]||{method:"cash"}).method] || "1000", cr:net});
    if (cost){ lines.push({acc:"1300", dr:cost}); lines.push({acc:"5000", cr:cost}); }
    Ledger.post(today(), ref, "Goods returned against "+sale.ref, lines, {module:"return"});
    DB.returns.push({ id:uid(), ref, date:today(), saleRef:sale.ref, saleId, items, net, reason:reason||"", user:DB.session.user });
    audit("reverse","Sales",ref,"Return against "+sale.ref,"",money(net),reason||"");
    return ref;
  },

  /* ---------------- PURCHASE ---------------- */
  recordPurchase({ date, supplierId, items, method, note }){
    date = date || today();
    let total = 0;
    for (const it of items) total = r2(total + it.qty*it.cost);
    const claim = (arguments[0].taxInvoice !== false) && vatRate() > 0;
    const inVat = claim ? vatPart(total) : 0;
    const stockValue = r2(total - inVat);
    const ref = nextRef("PUR", date);
    const lines = [{ acc:"1300", dr:stockValue }];
    if (inVat) lines.push({ acc:"1250", dr:inVat });
    if (method === "credit"){
      if (!supplierId) throw new Error("Choose the supplier you are buying from on credit.");
      lines.push({ acc:"2000", cr:total });
      DB.suppTx.push({ id:uid(), date, supplier:supplierId, ref, kind:"Credit purchase", amount:total });
    } else { lines.push({ acc:PAY_ACC[method], cr:total }); noteFx([{ method, amount:total }], date, -1); }
    Ledger.post(date, ref, "Stock bought" + (supplierId?" from "+this.supplier(supplierId).name:""), lines, {module:"purchase"});

    for (const it of items){
      const p = this.product(it.productId);
      const held = this.stockOf(p.id);
      const oldAvg = this.avgCost(p.id);
      const unit = claim ? r4(it.cost / (1 + vatRate())) : r4(it.cost);   // cost without the VAT you reclaim
      const newAvg = (held + it.qty) > 0 ? r4((held*oldAvg + it.qty*unit) / (held + it.qty)) : r4(unit);
      p.avgCost = newAvg;                                  // weighted average cost
      if (r2(it.cost) !== r2(p.buy)){
        p.priceHistory = p.priceHistory||[];
        p.priceHistory.push({ from:date, sell:p.sell, buy:r2(it.cost) });
        p.buy = r2(it.cost);
      }
      this.moveStock(p.id, it.qty, "purchase", ref);
    }
    const pur = { id:uid(), ref, date, supplierId:supplierId||null, items:items.map(i=>({...i, name:this.product(i.productId).name})),
                  total, vat:inVat, stockValue, method, note:note||"", user:DB.session.user };
    DB.purchases.push(pur);
    audit("create","Purchases",ref,"Stock bought "+money(total),"",money(total),"");
    return pur;
  },

  /* ---------------- EXPENSE ---------------- */
  recordExpense({ date, acc, amount, method, note, fx }){
    date = date || today();
    const ref = nextRef("EXP", date);
    Ledger.post(date, ref, ACC_NAME[acc] + (note?" — "+note:""),
      [{acc, dr:amount},{acc:PAY_ACC[method], cr:amount}], {module:"expense"});
    noteFx([{ method, amount:r2(amount), fx }], date, -1);
    const e = { id:uid(), ref, date, acc, amount:r2(amount), method, fx:fx||null, note:note||"", user:DB.session.user };
    DB.expenses.push(e);
    audit("create","Expenses",ref,ACC_NAME[acc]+" "+money(amount),"",money(amount),note||"");
    return e;
  },

  /* ---------------- MONEY IN / OUT ---------------- */
  receiveFromCustomer({ date, customerId, amount, method, note, fx }){
    date = date || today();
    const ref = nextRef("PAY", date);
    Ledger.post(date, ref, "Payment received from "+this.customer(customerId).name,
      [{acc:PAY_ACC[method], dr:amount},{acc:"1200", cr:amount}], {module:"receipt"});
    noteFx([{ method, amount:r2(amount), fx }], date, +1);
    DB.custTx.push({ id:uid(), date, customer:customerId, ref, kind:"Payment received", amount:r2(-amount) });
    audit("create","Customers",ref,"Received from "+this.customer(customerId).name,"",money(amount),note||"");
    return ref;
  },
  paySupplier({ date, supplierId, amount, method, note, fx }){
    date = date || today();
    const ref = nextRef("PAY", date);
    Ledger.post(date, ref, "Paid "+this.supplier(supplierId).name,
      [{acc:"2000", dr:amount},{acc:PAY_ACC[method], cr:amount}], {module:"payment"});
    noteFx([{ method, amount:r2(amount), fx }], date, -1);
    DB.suppTx.push({ id:uid(), date, supplier:supplierId, ref, kind:"Payment made", amount:r2(-amount) });
    audit("create","Suppliers",ref,"Paid "+this.supplier(supplierId).name,"",money(amount),note||"");
    return ref;
  },
  transfer({ date, from, to, amount, note }){
    date = date || today();
    if (from === to) throw new Error("Choose two different places to move money between.");
    const ref = nextRef("TRF", date);
    Ledger.post(date, ref, "Moved money: "+PAY_NAME[from]+" to "+PAY_NAME[to],
      [{acc:PAY_ACC[to], dr:amount},{acc:PAY_ACC[from], cr:amount}], {module:"transfer"});
    noteFx([{ method:from, amount:r2(amount) }], date, -1);
    noteFx([{ method:to,   amount:r2(amount) }], date, +1);
    audit("create","Money",ref,"Moved "+money(amount)+" "+PAY_NAME[from]+" to "+PAY_NAME[to],"",money(amount),note||"");
    return ref;
  },
  ownerIn({ date, amount, method, note }){
    date = date || today();
    const ref = nextRef("CAP", date);
    Ledger.post(date, ref, "Owner put money in",
      [{acc:PAY_ACC[method], dr:amount},{acc:"3000", cr:amount}], {module:"capital"});
    audit("create","Money",ref,"Owner put in "+money(amount),"",money(amount),note||"");
    return ref;
  },
  ownerOut({ date, amount, method, note }){
    date = date || today();
    const ref = nextRef("DRW", date);
    Ledger.post(date, ref, "Owner took money out",
      [{acc:"3100", dr:amount},{acc:PAY_ACC[method], cr:amount}], {module:"drawings"});
    audit("create","Money",ref,"Owner took out "+money(amount),"",money(amount),note||"");
    return ref;
  },

  /* ---------------- STOCK CORRECTION ---------------- */
  adjustStock({ productId, newCount, reason, cause }){
    const p = this.product(productId);
    const have = this.stockOf(productId);
    const diff = r2(newCount - have);
    if (Math.abs(diff) < 0.0005) throw new Error("That is the same as the count already recorded.");
    const ref = nextRef("ADJ");
    const value = r2(Math.abs(diff) * this.avgCost(productId));
    const lossAcc = cause === "damaged" ? "6160" : cause === "stolen" ? "6170" : "6900";
    if (diff < 0) Ledger.post(today(), ref, "Stock shortage: "+p.name,
      [{acc:lossAcc, dr:value},{acc:"1300", cr:value}], {module:"adjust"});
    else Ledger.post(today(), ref, "Extra stock found: "+p.name,
      [{acc:"1300", dr:value},{acc:"6900", cr:value}], {module:"adjust"});
    this.moveStock(productId, diff, "adjustment", ref, reason);
    audit("adjust","Stock",ref,p.name+" count corrected", qty(have), qty(newCount), reason||"");
    return ref;
  },

  /* ---------------- GOODS GOING BACK TO A SUPPLIER ---------------- */
  returnedToSupplier(purchaseId, productId){
    let q = 0;
    for (const pr of DB.purchaseReturns) if (pr.purchaseId === purchaseId)
      for (const i of pr.items) if (i.productId === productId) q += i.qty;
    return r2(q);
  },
  returnPurchase(purchaseId, picks, reason){
    const pur = DB.purchases.find(p=>p.id===purchaseId);
    if (!pur) throw new Error("That purchase is not in the records.");
    const items = [];
    let value = 0;
    for (const pick of picks){
      if (!pick.qty) continue;
      const orig = pur.items.find(i=>i.productId===pick.productId);
      if (!orig) continue;
      const already = this.returnedToSupplier(purchaseId, pick.productId);
      if (pick.qty > r2(orig.qty - already))
        throw new Error("You cannot send back more "+this.product(pick.productId).name+" than you bought.");
      if (pick.qty > this.stockOf(pick.productId))
        throw new Error("You only have "+qty(this.stockOf(pick.productId))+" "+this.product(pick.productId).name+" left to send back.");
      const amt = r2(pick.qty * orig.cost);
      value = r2(value + amt);
      items.push({ productId:pick.productId, name:orig.name, qty:r2(pick.qty), cost:orig.cost, amount:amt });
    }
    if (!items.length) throw new Error("Nothing selected to send back.");
    const ref = nextRef("PRET");
    const claimed = r2(pur.vat||0) > 0;
    const backVat = claimed ? r2(value * (r2(pur.vat) / r2(pur.total))) : 0;
    const lines = [{ acc:"1300", cr:r2(value - backVat) }];
    if (backVat) lines.push({ acc:"1250", cr:backVat });
    if (pur.method === "credit"){
      lines.push({ acc:"2000", dr:value });
      DB.suppTx.push({ id:uid(), date:today(), supplier:pur.supplierId, ref, kind:"Goods sent back", amount:r2(-value) });
    } else lines.push({ acc:PAY_ACC[pur.method], dr:value });
    Ledger.post(today(), ref, "Goods sent back against "+pur.ref, lines, {module:"purchase-return"});
    for (const i of items) this.moveStock(i.productId, -i.qty, "supplier-return", ref, reason);
    DB.purchaseReturns.push({ id:uid(), ref, date:today(), purchaseId, purchaseRef:pur.ref,
      supplierId:pur.supplierId, items, value, reason:reason||"", user:DB.session.user });
    audit("reverse","Purchases",ref,"Sent back to supplier against "+pur.ref,"",money(value),reason||"");
    return ref;
  },

  /* ---------------- QUOTATIONS ---------------- */
  saveQuote({ customerId, items, discount, note, validDays }){
    const date = today();
    const recs = items.map(it=>{
      const p = this.product(it.productId);
      return { productId:p.id, name:p.name, qty:it.qty, price:r2(it.price), discount:r2(it.discount||0),
               net:r2(it.qty*it.price - (it.discount||0)) };
    });
    const total = r2(recs.reduce((s,i)=>s+i.net,0) - r2(discount||0));
    const q = { id:uid(), ref:nextRef("QUO", date), date, validUntil:addDays(date, validDays||14),
                customerId:customerId||null, items:recs, discount:r2(discount||0), total,
                note:note||"", status:"open", saleRef:null, user:DB.session.user };
    DB.quotes.push(q);
    audit("create","Quotations",q.ref,"Quote for "+money(total),"",money(total),"");
    return q;
  },
  quoteStatus(q){
    if (q.status !== "open") return q.status;
    return q.validUntil < today() ? "expired" : "open";
  },

  /* ---------------- THE ZiG RATE MOVED ---------------- */
  revalueFx(newRate, note){
    if (!(newRate > 0)) throw new Error("Enter the new rate — how many "+fxCode()+" to one US dollar.");
    const units = fxUnits();
    const nowBase = Ledger.read("1005");
    const target = r2(units / newRate);
    const diff = r2(target - nowBase);
    const old = fxRateOn(today());
    DB.settings.fxHistory = DB.settings.fxHistory || [];
    DB.settings.fxHistory.push({ date:today(), rate:Number(newRate) });
    DB.settings.fxRate = Number(newRate);
    if (Math.abs(diff) >= 0.005){
      const ref = nextRef("FX");
      Ledger.post(today(), ref, "ZiG rate moved from "+old+" to "+newRate+" per US dollar",
        diff > 0 ? [{acc:"1005", dr:diff},{acc:"4910", cr:diff}]
                 : [{acc:"4910", dr:-diff},{acc:"1005", cr:-diff}], {module:"fx"});
      audit("adjust","Money",ref,"ZiG till revalued", money(nowBase), money(target), note||"");
      return { ref, old, rate:Number(newRate), units, was:nowBase, now:target, diff };
    }
    audit("edit","Settings","","ZiG rate changed", String(old), String(newRate), note||"");
    return { ref:null, old, rate:Number(newRate), units, was:nowBase, now:target, diff:0 };
  },

  /* ---------------- FULL STOCK TAKE ---------------- */
  stockTake(entries, cause, reason){
    const changes = [];
    let short = 0, surplus = 0;
    for (const e of entries){
      const have = this.stockOf(e.productId);
      const diff = r2(e.counted - have);
      if (Math.abs(diff) < 0.0005) continue;
      const value = r2(Math.abs(diff) * this.avgCost(e.productId));
      if (diff < 0) short = r2(short + value); else surplus = r2(surplus + value);
      changes.push({ productId:e.productId, name:this.product(e.productId).name, had:have, counted:e.counted, diff, value });
    }
    if (!changes.length) throw new Error("Every count matched what the system expected. Nothing to correct.");
    const ref = nextRef("STK");
    const lossAcc = cause === "damaged" ? "6160" : cause === "stolen" ? "6170" : "6900";
    const lines = [];
    if (short){ lines.push({ acc:lossAcc, dr:short }); lines.push({ acc:"1300", cr:short }); }
    if (surplus){ lines.push({ acc:"1300", dr:surplus }); lines.push({ acc:"6900", cr:surplus }); }
    Ledger.post(today(), ref, "Stock take across "+changes.length+" item"+(changes.length>1?"s":""), lines, {module:"stocktake"});
    for (const c of changes){
      this.moveStock(c.productId, c.diff, "stocktake", ref, reason);
      audit("adjust","Stock",ref,c.name+" counted", qty(c.had), qty(c.counted), reason||"");
    }
    DB.stockTakes = DB.stockTakes || [];
  DB.fx = DB.fx || { units:0 };
  DB.settings.fxCode = DB.settings.fxCode || "ZiG";
  DB.settings.fxHistory = DB.settings.fxHistory || [];
    DB.stockTakes.push({ id:uid(), ref, date:today(), changes, short, surplus, cause, reason:reason||"", user:DB.session.user });
    return { ref, changes, short, surplus };
  },

  /* ---------------- DASHBOARD FIGURES ---------------- */
  todayFigures(d){
    d = d || today();
    const sales = r2(DB.sales.filter(s=>s.date===d && !s.voided).reduce((s,x)=>s+x.net,0));
    const rets  = r2(DB.returns.filter(x=>x.date===d).reduce((s,x)=>s+x.net,0));
    const cogs  = r2(Ledger.movement("5000", d, d));
    const exp   = r2(Ledger.typeTotal("expense", d, d));
    return { sales:r2(sales-rets), cogs, expenses:exp, profit:r2(sales-rets-cogs-exp) };
  },
  lowStock(){
    return DB.products.filter(p=>p.type==="good" && p.active!==false)
      .map(p=>({ p, q:this.stockOf(p.id) }))
      .filter(x=>x.q <= (x.p.reorder||0))
      .sort((a,b)=>a.q-b.q);
  }
};

/* Deterministic demo trading history so every report, budget and simulation
   has something honest to work with. Everything below goes through the same
   engine the live buttons use — nothing is written straight into the ledger. */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

function addStarterPack(category){
  const list = STARTER[category] || STARTER["Mixed business"];
  let added = 0;
  for (const [name, buy, sell, unit, reorder] of list){
    if (DB.products.some(p=>p.name.toLowerCase() === name.toLowerCase())) continue;
    /* Anything with no reorder level is something you make or do, not something
       you count on a shelf — a plate of sadza, an hour of labour, a haircut. */
    const isService = reorder === 0;
    const p = { id:uid(), code:name.replace(/[^A-Za-z0-9]/g,"").slice(0,6).toUpperCase(), name,
                category, type: isService ? "service" : "good", buy:r2(buy), sell:r2(sell), avgCost:r2(buy),
                unit, reorder, active:true, priceHistory:[{ from:today(), sell:r2(sell), buy:r2(buy) }] };
    if (isService) p.costEst = r2(buy);
    DB.products.push(p); added++;
  }
  audit("create","Products","","Added "+added+" starter items for "+category,"","","");
  return added;
}

/* PIN hashing. Uses the device's own crypto where it exists; never stores the PIN. */
async function hashPin(pin, salt, scheme){
  /* scheme is the first letter of an existing hash: keep using whatever made it,
     so a login still works if the app later opens without a secure context. */
  const enc = new TextEncoder().encode(salt + "|" + pin + "|smebiz");
  try {
    if (scheme !== "f" && window.crypto && window.crypto.subtle){
      let buf = enc;
      for (let i=0;i<200;i++) buf = new Uint8Array(await crypto.subtle.digest("SHA-256", buf));
      return "s" + Array.from(buf).map(b=>b.toString(16).padStart(2,"0")).join("");
    }
  } catch(e){ /* falls through on non-secure contexts */ }
  let x = 0x811c9dc5;
  for (let round=0; round<5000; round++)
    for (let i=0;i<enc.length;i++){ x ^= enc[i]; x = Math.imul(x, 0x01000193) >>> 0; }
  return "f" + x.toString(16);
}
async function makeUser(name, role, pin){
  const salt = uid() + uid();
  return { id:uid(), name, role, salt, hash: await hashPin(pin, salt), created:new Date().toISOString(), active:true };
}

function wizardStep(action){

    if (!WIZ.biz.name){ toast("Give the business a name.", true); return; }
    if (!WIZ.biz.owner){ toast("Who owns it?", true); return; }
  }
  if (s === 2){ WIZ.biz.category = $("#wCat").value; WIZ.biz.currency = $("#wCur").value; WIZ.biz.yearStart = $("#wYear").value; }
  if (s === 3){
    WIZ.pin = $("#wPin").value.trim(); WIZ.pin2 = $("#wPin2").value.trim();
    if (!/^\d{4}$/.test(WIZ.pin)){ toast("The PIN must be four numbers.", true); return; }
    if (WIZ.pin !== WIZ.pin2){ toast("The two PINs do not match.", true); return; }
  }
  if (s === 4){
    WIZ.open = { cash:Number($("#wCash").value)||0, mobile:Number($("#wMob").value)||0, bank:Number($("#wBank").value)||0 };
    WIZ.starter = $("#wStarter") ? $("#wStarter").checked : false;
    return finishSetup();
  }
  WIZ.step = s + 1; drawSetup();
}

function businessHealth(){
  /* Judged on the last 30 days against the 30 before that. A calendar month is
     useless on the 1st, when there is barely a day of trading to look at. */
  const to = today(), from = addDays(to,-29);
  const prevTo = addDays(from,-1), prevFrom = addDays(prevTo,-29);
  const salesNow = Ledger.typeTotal("income", from, to);
  const salesPrev = Ledger.typeTotal("income", prevFrom, prevTo);
  const expNow = Ledger.typeTotal("expense", from, to);
  const expPrev = Ledger.typeTotal("expense", prevFrom, prevTo);
  const cash = moneyHeld();
  const gp = r2(salesNow - Ledger.movement("5000", from, to));
  const margin = salesNow ? gp/salesNow*100 : 0;
  const owed = Biz.totalOwedToYou(), owe = Biz.totalYouOwe();
  const low = Biz.lowStock().length;
  const G="#1B7A4B", Y="#B07908", Rr="#B02A24";
  const items = [
    { label:"Sales, last 30 days", color: salesPrev && salesNow<salesPrev*0.9 ? Y : G,
      state: salesPrev ? (salesNow>=salesPrev ? "Up on the 30 days before" : "Down on the 30 days before") : "Building up" },
    { label:"Money in hand", color: cash < owe ? Y : G, state: cash < owe ? "Tight" : "Comfortable" },
    { label:"Profit on sales", color: !salesNow?Y:margin<15?Rr:margin<22?Y:G,
      state: salesNow ? margin.toFixed(0)+"c in every dollar" : "No sales yet to measure" },
    { label:"Spending", color: expPrev && expNow>expPrev*1.15 ? Y : G, state: expPrev && expNow>expPrev*1.15 ? "Rising" : "Steady" },
    { label:"Customers owing you", color: salesNow && owed>salesNow*0.25?Rr:owed>0?Y:G, state: money(owed)+" outstanding" },
    { label:"Stock", color: low>3?Y:G, state: low ? low+" item"+(low>1?"s":"")+" running low" : "Well stocked" }
  ];
  const reds = items.filter(i=>i.color===Rr).length, yels = items.filter(i=>i.color===Y).length;
  const overall = reds ? {word:"Needs attention", cls:"bad"} : yels>1 ? {word:"Watch closely", cls:"warn"} : {word:"Healthy", cls:"ok"};
  let advice = "Sales, costs and stock are all moving the way they should. Keep recording every sale.";
  if (!salesNow) advice = "Record a few sales and this panel will start telling you how the business is really doing.";
  else if (owed > salesNow*0.25) advice = "Customers owe you "+money(owed)+" — that is a big share of the last 30 days' sales. Follow up the oldest accounts first.";
  else if (margin < 15) advice = "You are keeping only "+margin.toFixed(0)+" cents of every dollar you sell. Check what your suppliers are charging you before you buy again.";
  else if (cash < owe) advice = "You owe suppliers more than the money you are holding. Slow down credit purchases until customers pay you.";
  else if (low > 3) advice = low+" products are at or below their reorder level. Plan one purchase trip rather than several small ones.";
  return { items, overall, advice };
}

function addToCart(pid){
  const p = Biz.product(pid);
  const ex = CART.items.find(i=>i.productId===pid);
  if (p.type==="good" && Biz.stockOf(pid) <= (ex?ex.qty:0)){ toast("No stock left for "+p.name, true); return; }
  if (ex) ex.qty++;
  else CART.items.push({ productId:pid, qty:1, price:Biz.priceAt(p, today()), discount:0 });
  drawCart();
}
function cartTotals(){
  const gross = r2(CART.items.reduce((s,i)=>s+i.qty*i.price,0));
  const itemDisc = r2(CART.items.reduce((s,i)=>s+(i.discount||0),0));
  const net = r2(gross - itemDisc - r2(CART.discount||0));
  return { gross, itemDisc, disc:r2(itemDisc + r2(CART.discount||0)), net };
}

function completeSale(){
  const t = cartTotals();
  if (t.net <= 0){ toast("The sale total must be more than nothing.", true); return; }
  let payments;
  if (CART.method === "credit") payments = [];
  else if (CART.method === "split") payments = payMethods().map(m=>{
      const raw = Number(CART.pay[m])||0;
      if (raw <= 0) return null;
      return m === "zig"
        ? { method:m, amount:toBase(raw), fx:{ code:fxCode(), rate:fxRateOn(), amount:r2(raw) } }
        : { method:m, amount:r2(raw) };
    }).filter(Boolean);
  else if (CART.method === "zig")
    payments = [{ method:"zig", amount:t.net, fx:{ code:fxCode(), rate:fxRateOn(), amount:toFx(t.net) } }];
  else payments = [{ method:CART.method, amount:t.net }];
  const gross = r2(CART.items.reduce((s,i)=>s+i.qty*i.price,0));
  const whole = r2(CART.discount||0);
  const items = CART.items.map(i=>{                       // spread the sale-wide discount over the lines
    const share = gross ? r2(whole * (i.qty*i.price) / gross) : 0;
    return { ...i, discount: r2((i.discount||0) + share) };
  });
  const ok = saveAnd(()=>{ window._lastSale = Biz.recordSale({ items, payments, customerId:CART.customerId }); },
    "Sale recorded");
  if (!ok) return;
  const s = window._lastSale;
  if (CART.fromQuote){
    const q = DB.quotes.find(x=>x.id===CART.fromQuote);
    if (q){ q.status = "accepted"; q.saleRef = s.ref;
      audit("edit","Quotations",q.ref,"Quote became sale "+s.ref,"open","accepted",""); persist(); }
  }
  CART = freshCart();
  drawCart(); drawPicklist();
  openModal("Sale recorded", `
    <div class="sheet" style="border:0;box-shadow:none;padding:0">
      <p class="ref">${esc(s.ref)} &middot; ${niceDate(s.date)}</p>
      ${s.items.map(i=>`<div class="kv"><span>${esc(i.name)} &times; ${qty(i.qty)}</span><b>${money(i.net)}</b></div>`).join("")}
      <div class="ln total"><span class="lbl">Total</span><span class="dots"></span><span class="amt num">${money(s.net)}</span></div>
      ${s.credit>0.004?`<div class="note" style="margin-top:10px">${money(s.credit)} added to ${esc(Biz.customer(s.customerId).name)}'s account.</div>`:""}
    </div>`,
    `<button class="btn ghost" onclick="closeModal();go('dash')">Go home</button>
     <button class="btn gold" onclick="closeModal()">Next sale</button>`);
}

          ${goods.map(p=>`<option value="${p.id}">${esc(p.name)} — last cost ${money(p.buy)}</option>`).join("")}</select></div>
        <div class="frow">
          <div class="f"><label>How many</label><input id="bQty" class="num" inputmode="decimal" value="1"></div>
          <div class="f"><label>Cost each</label><div class="money-in"><span>$</span><input id="bCost" class="num" inputmode="decimal" value="0.00"></div></div>
        </div>
        <button class="btn ghost wide" id="bAdd">Add to this purchase</button>
      </div></div>
      <div class="card"><div class="bd">
        ${BUY.items.length ? `<div class="cart">${BUY.items.map((i,ix)=>{
          const p = Biz.product(i.productId);
          return `<div class="row"><div class="nm"><b>${esc(p.name)}</b><span>${qty(i.qty)} ${esc(p.unit)} @ ${money(i.cost)}</span></div>
            <div class="amt">${money(r2(i.qty*i.cost))}</div><button class="x" data-bx="${ix}">&times;</button></div>`;
        }).join("")}</div>` : `<div class="empty"><div class="big">No items yet</div>Add what you bought on the left.</div>`}
        <div class="ln total"><span class="lbl">Total cost</span><span class="dots"></span><span class="amt num">${money(total)}</span></div>
        <div class="f" style="margin-top:12px"><label>How did you pay?</label>
          <div class="seg" id="bSeg">${payMethods().concat(["credit"]).map(m=>`<button data-m="${m}" class="${BUY.method===m?"on":""}">${esc(PAY_NAME[m])}</button>`).join("")}</div></div>
        ${BUY.method==="credit" ? `<div class="note">This will be added to what you owe the supplier.</div>` : ""}
        ${BUY.method==="zig" ? `<div class="note">Hand over <b>${qty(toFx(total))} ${esc(fxCode())}</b> at
          ${qty(fxRateOn())} to the dollar. The cost is still recorded as ${money(total)}.</div>` : ""}
        <button class="btn gold wide" id="bSave" style="margin-top:12px" ${BUY.items.length?"":"disabled"}>Record purchase</button>
      </div></div>
    </div>`;
  $("#bSupp").onchange = e => BUY.supplierId = e.target.value;
  $("#bProd").onchange = e => { const p = Biz.product(e.target.value); if (p) $("#bCost").value = p.buy.toFixed(2); };
  $("#bAdd").onclick = () => {
    const pid = $("#bProd").value, q = Number($("#bQty").value), c = Number($("#bCost").value);
    if (!pid){ toast("Choose a product first.", true); return; }
    if (!(q>0)){ toast("How many did you buy?", true); return; }
    if (!(c>0)){ toast("Enter what each one cost you.", true); return; }
    BUY.items.push({ productId:pid, qty:r2(q), cost:r2(c) }); RENDER.purchase();
  };
  $$("#v-purchase [data-bx]").forEach(b => b.onclick = () => { BUY.items.splice(+b.dataset.bx,1); RENDER.purchase(); });
  $$("#bSeg button").forEach(b => b.onclick = () => { BUY.method = b.dataset.m; RENDER.purchase(); });
  $("#bSave").onclick = () => {
    if (saveAnd(()=>Biz.recordPurchase({ supplierId:BUY.supplierId||null, items:BUY.items, method:BUY.method }),
      "Purchase recorded — stock updated")){ BUY = { supplierId:"", items:[], method:"cash" }; RENDER.purchase(); }
  };
};
/* ---------------------------------------------------------------- STOCK */
RENDER.stock = function(){
  const goods = DB.products.filter(p=>p.type==="good");
  const servs = DB.products.filter(p=>p.type==="service");
  const value = Biz.stockValue();
  $("#v-stock").innerHTML = `
    <div class="pagehead"><div><h2>Stock and prices</h2><p>${goods.length} products and ${servs.length} services. Stock is worth ${money(value)}.</p></div>
      <span class="grow"></span>
      <button class="btn ghost sm" onclick="go('dash')">Back</button>
      ${goods.length?`<button class="btn ghost sm" onclick="stockTakeDialog()">Count everything</button>`:""}
      <button class="btn ghost sm" onclick="starterDialog()">Starter list</button>
      <button class="btn sm" onclick="newProduct()">Add item</button></div>
    ${DB.stockTakes && DB.stockTakes.length ? `<p class="sub" style="margin:-8px 0 12px">Last full count:
      ${niceDate(DB.stockTakes[DB.stockTakes.length-1].date)} &middot;
      ${DB.stockTakes[DB.stockTakes.length-1].changes.length} item(s) corrected.</p>` : ""}
    <div class="card"><div class="hd"><h3>Products you keep in stock</h3></div>
      <div class="bd" style="padding:0"><div class="scroll"><table class="tbl">
        <thead><tr><th>Item</th><th class="r">In stock</th><th class="r">Cost each</th><th class="r">You sell at</th><th class="r">Stock worth</th><th></th></tr></thead>
        <tbody>${goods.map(p=>{
          const q = Biz.stockOf(p.id), av = Biz.avgCost(p.id);
          const flag = q<=0 ? `<span class="pill bad">None</span>` : q<=p.reorder ? `<span class="pill warn">Low</span>` : "";
          return `<tr><td><b>${esc(p.name)}</b><div class="ref">${esc(p.code)} &middot; ${esc(p.category)}</div></td>
            <td class="r">${qty(q)} ${esc(p.unit)} ${flag}</td><td class="r">${money(av)}</td>
            <td class="r">${money(p.sell)}</td><td class="r">${money(r2(q*av))}</td>
            <td class="r"><button class="btn ghost sm" data-item="${p.id}">Open</button></td></tr>`;
        }).join("")}
        <tr class="grand"><td>Total stock value</td><td colspan="3"></td><td class="r">${money(value)}</td><td></td></tr></tbody>
      </table></div></div></div>

    <div class="card"><div class="hd"><h3>Services you sell</h3></div>
      <div class="bd" style="padding:0"><div class="scroll"><table class="tbl">
        <thead><tr><th>Service</th><th class="r">Costs you</th><th class="r">You charge</th><th></th></tr></thead>
        <tbody>${servs.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="ref">${esc(p.code)} &middot; per ${esc(p.unit)}</div></td>
          <td class="r">${money(p.costEst||0)}</td><td class="r">${money(p.sell)}</td>
          <td class="r"><button class="btn ghost sm" data-item="${p.id}">Open</button></td></tr>`).join("")}</tbody>
      </table></div></div></div>`;
  $$("#v-stock [data-item]").forEach(b => b.onclick = () => openItem(b.dataset.item));
};

function openItem(id){
  const p = Biz.product(id);
  const moves = DB.stock.filter(m=>m.product===id).slice(-14).reverse();
  let run = Biz.stockOf(id);
  const rows = moves.map(m=>{ const bal = run; run = r2(run - m.qty);
    return `<tr><td>${niceDate(m.date)}</td><td>${esc(({sale:"Sold",purchase:"Bought in",opening:"Opening stock",
      "sale-return":"Customer returned",adjustment:"Count corrected"})[m.kind]||m.kind)}<div class="ref">${esc(m.ref)}</div></td>
      <td class="r">${m.qty>0?qty(m.qty):""}</td><td class="r">${m.qty<0?qty(-m.qty):""}</td><td class="r">${qty(bal)}</td></tr>`; }).join("");
  openModal(p.name, `
    <div class="kv"><span>In stock now</span><b>${p.type==="good"?qty(Biz.stockOf(id))+" "+esc(p.unit):"Service — no stock"}</b></div>
    <div class="kv"><span>Average cost</span><b>${money(Biz.avgCost(id))}</b></div>
    <div class="kv"><span>Selling price</span><b>${money(p.sell)}</b></div>
    <div class="kv"><span>Profit on each one</span><b>${money(r2(p.sell-(p.type==="good"?Biz.avgCost(id):(p.costEst||0))))}</b></div>
    ${p.type==="good"?`<div class="kv"><span>Tell me when it drops to</span><b>${qty(p.reorder)} ${esc(p.unit)}</b></div>`:""}
    <div class="btnrow" style="margin-top:14px">
      <button class="btn ghost sm" onclick="changePrice('${id}')">Change price</button>
      ${p.type==="good"?`<button class="btn ghost sm" onclick="countStock('${id}')">Correct the count</button>`:""}
    </div>
    ${p.type==="good"?`<div class="wrap-title">Recent movement</div><div class="scroll"><table class="tbl">
      <thead><tr><th>Date</th><th>What happened</th><th class="r">In</th><th class="r">Out</th><th class="r">Left</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="5">No movement yet.</td></tr>`}</tbody></table></div>`:""}
    ${(p.priceHistory||[]).length>1?`<div class="wrap-title">Price history</div>${
      p.priceHistory.slice(-6).reverse().map(h=>`<div class="kv"><span>From ${niceDate(h.from)}</span><b>${money(h.sell)}</b></div>`).join("")}`:""}`);
}

function changePrice(id){
  const p = Biz.product(id);
  openModal("Change price — "+p.name, `
    <div class="plain">Old prices are kept. Sales already recorded keep the price they were sold at.</div>
    <div class="frow" style="margin-top:12px">
      <div class="f"><label>New selling price</label><div class="money-in"><span>$</span><input id="npSell" class="num" value="${p.sell.toFixed(2)}"></div></div>
      <div class="f"><label>What it costs you</label><div class="money-in"><span>$</span><input id="npBuy" class="num" value="${(p.type==="good"?p.buy:(p.costEst||0)).toFixed(2)}"></div></div>
    </div>
    <div class="f"><label>Why are you changing it?</label><input id="npWhy" placeholder="e.g. supplier put prices up"></div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn gold" onclick="savePrice('${id}')">Save new price</button>`);
}
function savePrice(id){
  const p = Biz.product(id), sell = Number($("#npSell").value), buy = Number($("#npBuy").value);
  if (!(sell > 0)){ toast("Enter a selling price.", true); return; }
  saveAnd(()=>{ if (p.type==="service") p.costEst = r2(buy); Biz.setPrice(p, sell, buy, $("#npWhy").value.trim()); }, "Price updated");
  closeModal(); RENDER.stock();
}
function countStock(id){
  const p = Biz.product(id);
  openModal("Count check — "+p.name, `
    <div class="plain">The system says you have <b>${qty(Biz.stockOf(id))} ${esc(p.unit)}</b>. Enter what you actually counted.</div>
    <div class="f" style="margin-top:12px"><label>Counted on the shelf</label><input id="csQty" class="num" inputmode="decimal" value="${Biz.stockOf(id)}"></div>
    <div class="f"><label>What happened?</label><select id="csCause">
      <option value="miscount">Just a miscount</option>
      <option value="damaged">Damaged, broken or expired</option>
      <option value="stolen">Lost or stolen</option>
      <option value="unrecorded">A sale that was never entered</option>
    </select><div class="hint">This decides which cost the loss is booked against, so your reports show where stock really goes.</div></div>
    <div class="f"><label>Anything to add?</label><input id="csWhy" placeholder="e.g. crate dropped at the door"></div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn gold" onclick="doCount('${id}')">Save the count</button>`);
}
function doCount(id){
  if (saveAnd(()=>Biz.adjustStock({ productId:id, newCount:Number($("#csQty").value),
      cause:$("#csCause").value, reason:$("#csWhy").value.trim() }),
    "Stock count corrected")){ closeModal(); RENDER.stock(); }
}
function stockTakeDialog(){
  const goods = DB.products.filter(p=>p.type==="good" && p.active!==false);
  openModal("Count everything", `
    <div class="plain">Walk the shelves and type what you actually count. Leave anything you did not check exactly
    as it is. Nothing changes until you save.</div>
    <div class="f" style="margin-top:14px"><label>What explains any shortages?</label>
      <select id="stkCause">
        <option value="miscount">Ordinary counting differences</option>
        <option value="damaged">Damage, breakage or expiry</option>
        <option value="stolen">Loss or theft</option>
        <option value="unrecorded">Sales that were never entered</option>
      </select></div>
    <div class="f"><label>Note</label><input id="stkNote" placeholder="e.g. month-end count with Kuda"></div>
    <div class="scroll"><table class="tbl">
      <thead><tr><th>Item</th><th class="r">System says</th><th class="r">You counted</th></tr></thead>
      <tbody>${goods.map(p=>`<tr><td>${esc(p.name)}<div class="ref">${esc(p.unit)}</div></td>
        <td class="r">${qty(Biz.stockOf(p.id))}</td>
        <td class="r" style="width:110px"><input class="num" data-stk="${p.id}" inputmode="decimal"
          value="${Biz.stockOf(p.id)}" style="padding:7px;text-align:right"></td></tr>`).join("")}</tbody>
    </table></div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn gold" id="stkSave">Save the count</button>`);
  $("#stkSave").onclick = () => {
    const entries = $$("[data-stk]").map(el=>({ productId:el.dataset.stk, counted:Number(el.value)||0 }));
    let out = null;
    const ok = saveAnd(()=>{ out = Biz.stockTake(entries, $("#stkCause").value, $("#stkNote").value.trim()); },
      "Stock count saved");
    if (!ok) return;
    closeModal(); RENDER.stock();
    openModal("Count finished", `
      <div class="kv"><span>Items corrected</span><b>${out.changes.length}</b></div>
      <div class="kv"><span>Stock missing, written off</span><b class="neg">${money(out.short)}</b></div>
      <div class="kv"><span>Extra stock found</span><b class="pos">${money(out.surplus)}</b></div>
      <div class="wrap-title">What changed</div>
      <div class="scroll"><table class="tbl"><thead><tr><th>Item</th><th class="r">Was</th><th class="r">Now</th><th class="r">Value</th></tr></thead>
      <tbody>${out.changes.map(c=>`<tr><td>${esc(c.name)}</td><td class="r">${qty(c.had)}</td>
        <td class="r">${qty(c.counted)}</td><td class="r">${c.diff<0?"-":"+"}${money(c.value)}</td></tr>`).join("")}</tbody></table></div>
      <div class="plain" style="margin-top:14px">Reference ${esc(out.ref)}. Every line above is in the audit trail
      with your name against it.</div>`);
  };
}
function starterDialog(){
  const cats = Object.keys(STARTER);
  const guess = cats.find(c => c.toLowerCase().includes((DB.business.category||"").toLowerCase().split(" ")[0])) || cats[0];
  openModal("Add a starter list", `
    <div class="plain">A ready-made list of the things a business like yours usually sells, so you are not typing
    from nothing. Change every price to your own — these are only placeholders. Anything already on your list is skipped.</div>
    <div class="f" style="margin-top:14px"><label>What kind of business?</label>
      <select id="spCat">${cats.map(c=>`<option ${c===guess?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
    <div id="spPreview"></div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn gold" id="spSave">Add these items</button>`);
  const preview = () => {
    const list = STARTER[$("#spCat").value] || [];
    $("#spPreview").innerHTML = `<div class="wrap-title">What will be added</div>` + list.map(x=>
      `<div class="kv"><span>${esc(x[0])}</span><b style="font-weight:500">${x[1]?money(x[1])+" &rarr; ":""}${money(x[2])}</b></div>`).join("");
  };
  $("#spCat").onchange = preview; preview();
  $("#spSave").onclick = () => {
    let n = 0;
    saveAnd(()=>{ n = addStarterPack($("#spCat").value); }, "Starter list added");
    closeModal(); RENDER.stock();
    toast(n ? n+" items added — set your own prices next" : "Those items were already on your list", !n);
  };
}

function newProduct(){
  openModal("Add something you sell", `
    <div class="f"><label>Is it a thing you keep in stock, or a service?</label>
      <div class="seg" id="npSeg"><button data-t="good" class="on">Goods</button><button data-t="service">Service</button></div></div>
    <div class="frow">
      <div class="f"><label>Name</label><input id="niName" placeholder="e.g. Sugar 2kg"></div>
      <div class="f"><label>Short code</label><input id="niCode" placeholder="e.g. SUG2"></div>
    </div>
    <div class="frow">
      <div class="f"><label>What it costs you</label><div class="money-in"><span>$</span><input id="niBuy" class="num" value="0.00"></div></div>
      <div class="f"><label>What you sell it for</label><div class="money-in"><span>$</span><input id="niSell" class="num" value="0.00"></div></div>
    </div>
    <div class="frow">
      <div class="f"><label>Sold by the</label><input id="niUnit" value="each"></div>
      <div class="f"><label>Group</label><input id="niCat" value="General"></div>
    </div>
    <div class="frow" id="niStockRow">
      <div class="f"><label>How many you have now</label><input id="niOpen" class="num" value="0"></div>
      <div class="f"><label>Warn me when it drops to</label><input id="niReorder" class="num" value="5"></div>
    </div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn gold" id="niSave">Add item</button>`);
  let type = "good";
  $$("#npSeg button").forEach(b => b.onclick = () => { type = b.dataset.t;
    $$("#npSeg button").forEach(x=>x.classList.toggle("on", x===b));
    $("#niStockRow").style.display = type==="good" ? "" : "none"; });
  $("#niSave").onclick = () => {
    const name = $("#niName").value.trim();
    if (!name){ toast("Give the item a name.", true); return; }
    const buy = r2(Number($("#niBuy").value)||0), sell = r2(Number($("#niSell").value)||0);
    saveAnd(()=>{
      const p = { id:uid(), code:($("#niCode").value.trim()||name.slice(0,4)).toUpperCase(), name,
        category:$("#niCat").value.trim()||"General", type, buy, sell, avgCost:buy, unit:$("#niUnit").value.trim()||"each",
        reorder:Number($("#niReorder").value)||0, active:true, priceHistory:[{from:today(), sell, buy}] };
      if (type==="service") p.costEst = buy;
      DB.products.push(p);
      const open = type==="good" ? Number($("#niOpen").value)||0 : 0;
      if (open > 0){
        const ref = nextRef("ADJ");
        Biz.moveStock(p.id, open, "opening", ref, "Item added");
        Ledger.post(today(), ref, "Stock counted in: "+name,
          [{acc:"1300", dr:r2(open*buy)},{acc:"3000", cr:r2(open*buy)}], {module:"opening"});
      }
      audit("create","Products",p.code,"Added "+name,"","","");
    }, "Item added");
    closeModal(); RENDER.stock();
  };
}

function newParty(kind){
  const isC = kind === "customer";
  openModal("Add "+kind, `
    <div class="f"><label>Name</label><input id="pyName" placeholder="${isC?"e.g. John Banda":"e.g. XYZ Wholesalers"}"></div>
    <div class="f"><label>Phone</label><input id="pyPhone" placeholder="077…"></div>
    ${isC?`<div class="f"><label>Most they may owe you at once</label><div class="money-in"><span>$</span><input id="pyLimit" class="num" value="100"></div></div>`:""}
    <div class="f"><label>${isC?"They already owe you":"You already owe them"} (leave at 0 if not)</label>
      <div class="money-in"><span>$</span><input id="pyOpen" class="num" value="0.00"></div></div>
    <div class="f"><label>Note</label><input id="pyNote" placeholder="optional"></div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancel</button>
     <button class="btn gold" id="pySave">Add ${kind}</button>`);
  $("#pySave").onclick = () => {
    const name = $("#pyName").value.trim();
    if (!name){ toast("Enter a name.", true); return; }
    saveAnd(()=>{
      const open = r2(Number($("#pyOpen").value)||0);
      const rec = { id:uid(), name, phone:$("#pyPhone").value.trim(), opening:open, note:$("#pyNote").value.trim() };
      if (isC){ rec.limit = Number($("#pyLimit").value)||0; DB.customers.push(rec); }
      else DB.suppliers.push(rec);
      if (open > 0){
        const ref = nextRef(isC?"AR":"AP");
        Ledger.post(today(), ref, "Opening balance for "+name,
          isC ? [{acc:"1200",dr:open},{acc:"3000",cr:open}] : [{acc:"3000",dr:open},{acc:"2000",cr:open}], {module:"opening"});
      }

    }, (isC?"Customer":"Supplier")+" added");
